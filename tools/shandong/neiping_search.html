* { margin: 0; padding: 0; box-sizing: border-box; }

  color: #333;
  min-height: 100vh;
}

.header {

  color: #fff;

  text-align: center;
}
.header h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: 0.8; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

/* Search */
.search-box {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}
.search-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-input {
  flex: 1;
  min-width: 280px;
  height: 48px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  padding: 0 16px;
  font-size: 16px;
  transition: border-color 0.2s;
}
.search-input:focus {
  outline: none;
  border-color: #2d6aa0;
}
.search-input::placeholder { color: #b0b0b0; }
.search-hint {
  font-size: 13px;
  color: #999;
  margin-top: 8px;
}

/* Stats */
.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.stat-card {
  background: #fff;
  border-radius: 8px;
  padding: 16px 20px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  flex: 1;
  min-width: 140px;
  text-align: center;
}
.stat-card .num { font-size: 32px; font-weight: 700; color: #1a3a5c; }
.stat-card .label { font-size: 13px; color: #888; margin-top: 2px; }

/* Table */
.table-wrap {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead { background: #f7f8fa; }
th {
  padding: 14px 16px;
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  color: #666;
  border-bottom: 2px solid #e8e8e8;
  white-space: nowrap;
}
td {
  padding: 12px 16px;
  font-size: 14px;
  border-bottom: 1px solid #f0f0f0;
}
tr:hover td { background: #f0f6fb; }
.name-col { font-weight: 500; color: #1a3a5c; }
.prov-col { color: #666; }

/* Rating badges */
.rating {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  font-family: "SF Mono", "Consolas", "Menlo", monospace;
}
.r-aaa { background: #e8f5e9; color: #2e7d32; }

.no-result .icon { font-size: 48px; margin-bottom: 12px; }

.footer {

  padding: 24px;
  color: #999;
  font-size: 12px;
}

</div>

</div>

function getRatingClass(rating) {
  const key = 'r-' + rating.toLowerCase()
    .replace(/\+/g, '-plus')
    .replace(/\-/g, '-minus');
  return key;
}

function renderStats(filtered) {
  const total = DATA.length;
  const shown = filtered.length;
  const provinces = new Set(filtered.map(d => d.province)).size;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${shown}</div><div class="label">匹配企业</div></div>
    <div class="stat-card"><div class="num">${total}</div><div class="label">总企业数</div></div>
    <div class="stat-card"><div class="num">${provinces}</div><div class="label">涉及地域</div></div>
  `;
  document.getElementById('totalCount').textContent = total;
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  const noResult = document.getElementById('noResult');

  if (data.length === 0) {
    tbody.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';

  tbody.innerHTML = data.map(d => `
    <tr>
      <td>${d.seq.replace('.0', '')}</td>
      <td class="name-col">${d.name}</td>
      <td class="prov-col">${d.province}</td>
      <td><span class="rating ${getRatingClass(d.extRating)}">${d.extRating}</span></td>
      <td><span class="rating ${getRatingClass(d.intRating)}">${d.intRating}</span></td>
    </tr>
  `).join('');
}

function doSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    renderStats(DATA);
    renderTable(DATA);
    return;
  }
  const filtered = DATA.filter(d =>
    d.name.toLowerCase().includes(q) ||
    d.province.toLowerCase().includes(q)
  );
  renderStats(filtered);
  renderTable(filtered);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  doSearch('');
});

document.getElementById('searchInput').addEventListener('input', function(e) {
  doSearch(e.target.value);
});
</script>
