function photoCover(city) {
  const photos = photoPool(city);
  return photos.length ? thumbOf(photos[0]) : VID_ICON_SVG;
}
// 胶片封面: 随机一张照片(轮动); exclude 为当前显示, 避免换到同一张
function randomPhotoCover(city, exclude) {
  const photos = photoPool(city);
  if (!photos.length) return VID_ICON_SVG;
  const all = photos.map(thumbOf);
  const rest = all.filter(t => t !== exclude);
  const pool = rest.length ? rest : all;
  return pool[Math.floor(Math.random() * pool.length)];
}
function openLightbox(city) {
  const imgs = photoImgs(city);
  if (!imgs.length) return;
  lbCity = city; lbIdx = 0;
  lbOpenAt = Date.now();
  document.getElementById('lightbox').classList.add('open');
  updateLightbox();
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  // 停止视频
  const v = document.getElementById('lb-video');
  v.pause(); v.removeAttribute('src');
}
function lbNav(d) {
  const imgs = photoImgs(lbCity);
  lbIdx = (lbIdx + d + imgs.length) % imgs.length;
  updateLightbox();
}
let lbSwapToken = 0;   // 原图替换令牌: 翻页后作废旧回调
function updateLightbox() {
  const imgs = photoImgs(lbCity);
  const media = imgs[lbIdx];
  const f = media.split('/').pop();
  const img = document.getElementById('lb-img');
  const vid = document.getElementById('lb-video');
  if (isVideo(media)) {
    // 视频: 自动播放(静音+循环, 浏览器自动播放策略)
    img.style.display = 'none';
    vid.style.display = '';
    vid.src = media;
    vid.play().catch(() => {});
  } else {
    vid.pause();
    vid.removeAttribute('src');
    vid.style.display = 'none';
    img.style.display = '';
    // 缩略图秒显(2026-09-20): 原图慢网单张 ~10 秒, 先保证有画面。
    // 缩放走 --lb-zoom 变量, 换 src 不影响当前缩放/平移。
    const thumb = thumbOf(media);
    img.src = thumb;
    const token = ++lbSwapToken;
    const thumbT0 = Date.now();
    const maybeHiRes = () => {
      if (token !== lbSwapToken) return;              // 已翻页
      if (img.style.display === 'none') return;       // 已切到视频
      if (Date.now() - thumbT0 > 1000) return;        // 链路慢, 保持缩略图
      const hi = new Image();
      hi.onload = () => {
        if (token !== lbSwapToken) return;
        if (img.style.display === 'none') return;
        img.src = media;
      };
      hi.src = media;
    };
    if (img.complete) maybeHiRes(); else img.addEventListener('load', maybeHiRes, { once: true });
  }
  document.getElementById('lb-title').textContent = `${lbCity} · ${f}${isVideo(media) ? ' 🎬' : ''}`;
  document.getElementById('lb-count').textContent = `${lbIdx+1} / ${imgs.length}`;
  // 同剧场: 首媒体用老板手写, 其余用该张 AI 描述
  const lbNoteEl = document.getElementById('lb-note');
  const lbNoteHtml = mediaNoteHtml(lbCity, media);
  lbNoteEl.innerHTML = lbNoteHtml;
  lbNoteEl.style.display = lbNoteHtml ? '' : 'none';
  resetLbZoom();  // 切照片重置缩放
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target !== document.getElementById('lightbox')) return;
  if (Date.now() - lbOpenAt < 400) return; // 防打开瞬间的点击穿透
  closeLightbox();
});

// ═══ 灯箱缩放: 滚轮 + 双指捏合(老板 09-16 拍板: 交互式, 不要手动滑条) ═══
const LB_MIN = 0.4, LB_MAX = 4.0;      // 40% ~ 400%
let lbZoom = 1, lbPanX = 0, lbPanY = 0, lbDrag = null, lbPinch = 0;
const lbStageEl = document.querySelector('.lb-stage');

function setLbZoom(z, opts) {
  const old = lbZoom;
  lbZoom = Math.max(LB_MIN, Math.min(LB_MAX, z));
  const box = document.getElementById('lb-media-box');
  box.style.setProperty('--lb-zoom', lbZoom);
  document.getElementById('lz-val').textContent = Math.round(lbZoom * 100) + '%';
  // 以鼠标位置为锚点缩放: 光标下的内容不动
  if (opts && opts.anchor && old > 0) {
    const k = lbZoom / old - 1;
    lbPanX -= (opts.anchor.x - lbStageEl.clientWidth / 2) * k;
    lbPanY -= (opts.anchor.y - lbStageEl.clientHeight / 2) * k;
  }
  applyLbPan();
}

function applyLbPan() {
  const box = document.getElementById('lb-media-box');
  const media = document.getElementById('lb-img').style.display !== 'none'
              ? document.getElementById('lb-img') : document.getElementById('lb-video');
  // 可平移量 = (缩放后尺寸 - 舞台尺寸) / 2(超出部分才可拖)
  const stage = lbStageEl.getBoundingClientRect();
  const r = media.getBoundingClientRect();
  const baseW = r.width / lbZoom, baseH = r.height / lbZoom;
  const maxX = Math.max(0, (baseW * lbZoom - stage.width) / 2);
  const maxY = Math.max(0, (baseH * lbZoom - stage.height) / 2);
  lbPanX = Math.max(-maxX, Math.min(maxX, lbPanX));
  lbPanY = Math.max(-maxY, Math.min(maxY, lbPanY));
  box.style.setProperty('--lb-pan-x', lbPanX + 'px');
  box.style.setProperty('--lb-pan-y', lbPanY + 'px');
}

// 切换照片时重置缩放
function resetLbZoom() {
  lbZoom = 1; lbPanX = 0; lbPanY = 0;
  const box = document.getElementById('lb-media-box');
  box.style.setProperty('--lb-zoom', 1);
  box.style.setProperty('--lb-pan-x', '0px');
  box.style.setProperty('--lb-pan-y', '0px');
  document.getElementById('lz-val').textContent = '100%';
}

// 滚轮缩放(桌面)
lbStageEl.addEventListener('wheel', e => {
  e.preventDefault();
  const r = lbStageEl.getBoundingClientRect();
  setLbZoom(lbZoom * (1 - e.deltaY * 0.0016), {
    anchor: { x: e.clientX - r.left, y: e.clientY - r.top }
  });
}, { passive: false });

// 双指捏合(手机)
lbStageEl.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    lbDrag = null;   // 双指时不做平移
    lbPinch = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });
lbStageEl.addEventListener('touchmove', e => {
  if (e.touches.length !== 2 || !lbPinch) return;
  e.preventDefault();
  const d = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY);
  const r = lbStageEl.getBoundingClientRect();
  const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
  const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
  setLbZoom(lbZoom * (d / lbPinch), { anchor: { x: cx, y: cy } });
  lbPinch = d;
}, { passive: false });
lbStageEl.addEventListener('touchend', e => {
  if (e.touches.length < 2) lbPinch = 0;
}, { passive: true });

// 双击: 100% ↔ 200% 切换
lbStageEl.addEventListener('dblclick', e => {
  e.preventDefault();
  resetLbZoom();
  if (lbZoom <= 1.01) {
    const r = lbStageEl.getBoundingClientRect();
    setLbZoom(lbZoom > 1.5 ? 1 : 2, { anchor: { x: e.clientX - r.left, y: e.clientY - r.top } });
  }
});

// 拖动平移(鼠标 + 单指)
lbStageEl.addEventListener('mousedown', e => {
  if (lbZoom <= 1.01) return;      // 未放大不拖
  lbDrag = { x: e.clientX, y: e.clientY, px: lbPanX, py: lbPanY };
  lbStageEl.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!lbDrag) return;
  lbPanX = lbDrag.px + (e.clientX - lbDrag.x);
  lbPanY = lbDrag.py + (e.clientY - lbDrag.y);
  applyLbPan();
});
window.addEventListener('mouseup', () => {
  lbDrag = null;
  lbStageEl.classList.remove('dragging');
});

// 单指拖动(手机)
lbStageEl.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || lbZoom <= 1.01) return;
  const t = e.touches[0];
  lbDrag = { x: t.clientX, y: t.clientY, px: lbPanX, py: lbPanY };
}, { passive: true });
lbStageEl.addEventListener('touchmove', e => {
  if (!lbDrag || e.touches.length !== 1) return;
  e.preventDefault();
  const t = e.touches[0];
  lbPanX = lbDrag.px + (t.clientX - lbDrag.x);
  lbPanY = lbDrag.py + (t.clientY - lbDrag.y);
  applyLbPan();
}, { passive: false });
lbStageEl.addEventListener('touchend', () => { lbDrag = null; }, { passive: true });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

// ── 城市墙 ──
let wallMode = 'prov'; // 'prov' 按省份 | 'timeline' 按时间线

function buildTimeline() {
  const wall = document.getElementById('city-wall');
  const known = CITIES.filter(c => c.since);
  const unknown = CITIES.filter(c => !c.since);
  const sorted = [...known].sort((a, b) => (a.since < b.since ? -1 : 1));
  let html = '';
  sorted.forEach(c => {
    html += `<div class="timeline-item" data-city="${c.name}">
      <span class="t-date">${c.since}</span>
      <span class="t-name">${c.name}</span>
      <span class="t-prov">${c.prov}</span>
      ${photoCount(c.name) ? `<span class="cam">📷${photoCount(c.name)}</span>` : ''}
    </div>`;
  });
  if (unknown.length) {
    html += `<div class="prov-group"><div class="prov-name">⏳ 待补首访时间（${unknown.length}）</div></div>`;
    html += `<div class="city-chips">`;
    unknown.forEach(c => {
      html += `<span class="chip" data-city="${c.name}">${c.name}</span>`;
    });
    html += `</div>`;
  }
  wall.innerHTML = html || '<div style="color:#aab0d0">待补首访时间</div>';
  wall.querySelectorAll('.timeline-item, .chip').forEach(el => {
    el.addEventListener('click', () => {
      const city = el.dataset.city;
      if (editMode) { openEditBox(city); return; }
      if (photoCount(city)) { flyAndOpen(city); return; }
      MapAPI.flyTo(city); highlightCity(city);
    });
  });
}

function buildWall() {
  const wall = document.getElementById('city-wall');
  const groups = {};
  CITIES.forEach(c => { (groups[c.prov] = groups[c.prov] || []).push(c); });
  let html = '';
  PROV_ORDER.forEach(p => {
    if (!groups[p]) return;
    html += `<div class="prov-group"><div class="prov-name">${p}</div><div class="city-chips">`;
    groups[p].forEach(c => {
      const cls = c.home ? 'chip home' : 'chip';
      const cam = photoCount(c.name)
        ? `<span class="cam">📷${photoCount(c.name)}</span>` : '';
      const sinceStr = sinceOf(c.name);
      const noteStr = noteOf(c.name);
      const since = sinceStr ? `<span class="cam since">${sinceStr}</span>` : '';
      const note = noteStr ? `<span class="cam">💬</span>` : '';
      html += `<span class="${cls}" data-city="${c.name}">${c.name}${since}${note}${cam}</span>`;
    });
    html += `</div></div>`;
  });
  wall.innerHTML = html;
  wall.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const city = chip.dataset.city;
      if (editMode) { openEditBox(city); return; }
      if (photoCount(city)) { flyAndOpen(city); return; }
      MapAPI.flyTo(city); highlightCity(city);
    });
  });
}

// ═══ 地图适配层 ═══
// 页面其余部分只认 MapAPI 这层契约, 不直接碰底层引擎。
// 目前后端是 echarts; 换 Three.js 3D 地球时只需新增一个同契约的后端。
// 8 个触点: project / isVisible / getZoom / getCenter / setCenter /
//           highlight / onRoam / onClick / resize
const MapAPI = {
  _backend: null,
  ready() { return !!(this._backend && this._backend.ready()); },
  mount(backend, el, opts) { this._backend = backend; backend.mount(el, opts); },
  dispose() { if (this._backend) this._backend.dispose(); this._backend = null; },

  project(coord)   { return this._backend ? this._backend.project(coord) : null; },
  isVisible(coord) { return this._backend ? this._backend.isVisible(coord) : false; },
  getZoom()        { return this._backend ? this._backend.getZoom() : 1; },
  getCenter()      { return this._backend ? this._backend.getCenter() : null; },
  setCenter(c)     { if (this._backend) this._backend.setCenter(c); },
  highlight(name)  { if (this._backend) this._backend.highlight(name); },
  onRoam(fn)       { if (this._backend) this._backend.onRoam(fn); },
  onClick(fn)      { if (this._backend) this._backend.onClick(fn); },
  resize()         { if (this._backend) this._backend.resize(); },
  // 3D 专属(阶段 2+ 才有实现, echarts 后端是空操作)
  flyTo(name, opts) { if (this._backend && this._backend.flyTo) this._backend.flyTo(name, opts); },
};

// ── echarts 后端(2D 中国地图, 默认) ──
const EchartsBackend = {
  chart: null,
  _roamFn: null, _clickFn: null,
  ready() { return !!this.chart && geoLoaded; },
  mount(el, opts) {
    this.chart = echarts.init(el);
    this.chart.showLoading({text:'地图加载中…', color:'#ffd166'});
    fetch('china.json')
      .then(r => r.json())
      .then(geojson => {
        geoLoaded = true;
        echarts.registerMap('china', geojson);
        this.chart.hideLoading();
        if (opts && opts.onReady) opts.onReady();
      })
      .catch(() => {
        this.chart.hideLoading(); this.chart.clear();
        el.replaceChildren();
        el.innerHTML =
          '<div style="padding:60px 20px;text-align:center;color:#aab0d0">地图数据加载失败（离线状态）<br>右侧城市墙正常可用</div>';
      });
  },
  dispose() { if (this.chart) { this.chart.dispose(); this.chart = null; } },
  // 经纬度 → 屏幕像素 [x,y]; 屏幕外返回 null
  project(coord) {
    if (!this.chart) return null;
    return this.chart.convertToPixel({geoIndex: 0}, coord);
  },
  // echarts 是平面地图, 没有背面概念 —— 恒 true
  isVisible() { return true; },
  getZoom() { return (this.chart && this.chart.getOption().geo[0].zoom) || 1; },
  getCenter() { return this.chart ? this.chart.getOption().geo[0].center : null; },
  setCenter(c) { if (this.chart) this.chart.setOption({ geo: [{ center: c }] }); },
  highlight(name) {
    if (!this.chart) return;
    this.chart.dispatchAction({ type:'showTip',   seriesIndex:1, name });
    this.chart.dispatchAction({ type:'highlight', seriesIndex:1, name });
    setTimeout(() => this.chart && this.chart.dispatchAction({type:'downplay', seriesIndex:1, name}), 1400);
  },
  onRoam(fn) { this._roamFn = fn; if (this.chart) this.chart.on('georoam', fn); },
  onClick(fn) {
    this._clickFn = fn;
    if (this.chart) this.chart.on('click', p => fn({ seriesType: p.seriesType, name: p.name }));
  },
  resize() { if (this.chart) this.chart.resize(); },
};

// ═══ Three.js 中国版图立体化后端 ═══
// 与 EchartsBackend 同契约。做法: GeoJSON → 墨卡托投影 → Shape → ExtrudeGeometry 挤出
// 省份成为可旋转的 3D 板块, 照片/足迹点立在地图表面。
const MAP_UNIT = 620;        // 投影后地图的基准尺度(世界单位), 3D 版视觉大小由它定
const EXTRUDE_DEPTH = 6;     // 省份挤出厚度
const FIT_MARGIN = 1.26;     // 相机留白系数(要容得下斜视时的厚度与边缘)

// ── 唯一一份投影: 经纬度 → 平面世界坐标 {x, y, z=0} ──
// 墨卡托 + 包围盒归一化: 投影后把整图缩放到 MAP_UNIT 量级并居中到原点
// 归一化参数在 _buildMap 里按实际数据算好存在 _proj 上
const _proj = { cx: 0, cy: 0, scale: 1 };

function mercator(lon, lat) {
  const x = lon * Math.PI / 180;
  const y = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
  return [x, y];
}
// 经纬度 → three 世界坐标 (XZ 平面, Y 朝上)
function mapVec(lon, lat, h) {
  const [mx, my] = mercator(lon, lat);
  return new THREE.Vector3(
    (mx - _proj.cx) * _proj.scale,
    h || 0,
    -(my - _proj.cy) * _proj.scale      // z 取反: 纬度越北 z 越负(屏幕上方)
  );
}
// 逆运算: 世界坐标 → 经纬度(给 getCenter 用)
function mapToLonLat(v) {
  const mx = v.x / _proj.scale + _proj.cx;
  const my = -v.z / _proj.scale + _proj.cy;
  const lon = mx * 180 / Math.PI;
  const lat = (Math.atan(Math.exp(my)) - Math.PI / 4) * 2 * 180 / Math.PI;
  return [lon, lat];
}

const _ZERO = { x: 0, z: 0 };   // 注视点默认值(相机看向原点)

const ThreeBackend = {
  renderer: null, scene: null, cam: null, mapGroup: null,
  _lookAt: null,                 // 相机注视点 {x, z}; 推近到足迹区时设成足迹重心
  marks: {},
  provinces: [],                // 省份 mesh(raycast 用)
  _raf: null, _roamFn: null, _clickFn: null, _tween: null,
  // 球坐标相机: theta=俯仰(0=正俯视, π/2=平视), phi=水平旋转
  // 俯 68°: 兼顾"立体厚度可见"与"地图尽量占满画面"(老板 09-16)
  rig: { theta: 0.38, phi: 0.0, dist: 0 },
  rigTgt: { theta: 0.38, phi: 0.0, dist: 0 },
  _defaultDist: 0,
  _spin: 0, _drag: null, _lastPt: null, _pinch: 0,
  _hoverName: null, _raycaster: null, _mouse: null,
  _ready: false, _wrap: null,
  _roamTimer: null,

  ready() { return this._ready; },

  mount(el, opts) {
    this._wrap = el.parentElement || el;
    const W = this._wrap.clientWidth || 600, H = this._wrap.clientHeight || 600;

    try {
      const t = document.createElement('canvas');
      if (!(t.getContext('webgl') || t.getContext('experimental-webgl'))) throw 0;
    } catch (e) { console.warn('[map3d] WebGL 不可用, 保持 2D'); return; }

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(W, H, false);
    this.renderer.domElement.style.cssText =
      'position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y';
    el.replaceChildren(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.cam = new THREE.PerspectiveCamera(38, W / H, 1, 6000);
    this._raycaster = new THREE.Raycaster();
    this._mouse = new THREE.Vector2();

    // 光照: 压低强度, 只做立体明暗层次(太强会把深蓝打平成浅蓝)
    this.scene.add(new THREE.AmbientLight(0x6c7bb8, 0.55));
    const key = new THREE.DirectionalLight(0xc8d4ff, 0.62);
    key.position.set(-0.6, 1, 0.75).multiplyScalar(1200);
    this.scene.add(key);
    const rim = new THREE.DirectionalLight(0x3f5bd0, 0.5);
    rim.position.set(0.8, 0.35, -0.9).multiplyScalar(1200);
    this.scene.add(rim);

    this.mapGroup = new THREE.Group();
    this.scene.add(this.mapGroup);

    // 省份全部就绪后再定相机
    fetch('china.json').then(r => r.json()).then(geo => {
      this._projCompute(geo);
      this._buildProvinces(geo);

      // 默认视角: 推近到"足迹密集区"(老板 09-16 拍板)
      // 39 个地点集中在华北-华中一带, 全国视角下照片会挤成一小团;
      // 推近后照片占满画面、看得清。想看全国自己拉远即可。
      const pts = CITIES.map(c => mapVec(c.coord[0], c.coord[1], 0));
      // 用"包围盒中心"而不是"重心" —— 视觉居中要看最外侧的点, 不是平均值
      // (重心会被密集区拉偏, 导致厦门/泉州这些东南端的点把画面撑向右下)
      const minX = Math.min(...pts.map(p => p.x)), maxX = Math.max(...pts.map(p => p.x));
      const minZ = Math.min(...pts.map(p => p.z)), maxZ = Math.max(...pts.map(p => p.z));
      const cx = (minX + maxX) / 2;
      const cz = (minZ + maxZ) / 2;
      // 足迹半径用"包围盒半宽" —— 照片群铺满画面的依据
      // 系数 1.05: 有自动居中兜底后可以放心推近, 照片更大更清楚
      const halfW = (maxX - minX) / 2, halfZ = (maxZ - minZ) / 2;
      const span = Math.max(60, Math.max(halfW, halfZ) * 1.05);

      this._homeCenter = { x: cx, z: cz, span };    // 供"复位"用
      this._fitDistFull = this._fitDist();          // 全国视角(拉远的上限)
      this._defaultDist = this._fitDistFull;
      // 相机对准"包围盒中心"; 俯角 35°(0.61 rad)
      // 俯角太小(22°)时垂直线被压得很扁, 照片群被推到画面下半; 35° 兼顾立体感与居中
      this.rig.theta = 0.61;
      this.rig.phi = Math.atan2(cx, cz);
      this.rig.dist = this._distForSpan(span);
      // 残余的透视下移: 把注视点沿视线方向外推补偿
      const halfFov = this.cam.fov * Math.PI / 360;
      const back = 0.22 * this.rig.dist * Math.tan(halfFov) * 2;
      this._lookAt = {
        x: cx + Math.sin(this.rig.phi) * back,
        z: cz + Math.cos(this.rig.phi) * back
      };
      Object.assign(this.rigTgt, this.rig);
      this._lastCenter = [110, 36];

      // ★ 立刻摆一次相机再启动循环 —— 标签页在后台时 RAF 不跑,
      //   若不预摆, project() 会因相机停在原点而全部返回 null(老板 09-16 反馈照片全挤成一点)
      this.cam.position.copy(this._camPos());
      this.cam.lookAt(0, 0, 0);
      this.cam.updateMatrixWorld();

      this._loop();
      this._bindInput();
      this._ready = true;
      if (opts && opts.onReady) opts.onReady();
    }).catch(err => {
      console.warn('[map3d] china.json 加载失败', err);
      if (opts && opts.onReady) opts.onReady();   // 让上层走回退判定
    });
  },

  dispose() {
    if (this._raf) cancelAnimationFrame(this._raf), this._raf = null;
    if (this.renderer) {
      this.renderer.dispose();
      if (this.renderer.domElement.parentElement) this.renderer.domElement.remove();
    }
    this._ready = false;
  },

  // ── 投影归一化: 算整图的中心与缩放, 让地图居中且大小稳定 ──
  _projCompute(geo) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const scan = coords => {
      for (const c of coords) {
        if (typeof c[0] === 'number') {
          const [x, y] = mercator(c[0], c[1]);
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        } else scan(c);
      }
    };
    for (const f of geo.features) scan(f.geometry.coordinates);
    _proj.cx = (minX + maxX) / 2;
    _proj.cy = (minY + maxY) / 2;
    // 以经度跨度为主定尺度(纬度跨度受墨卡托拉伸, 用经度更稳)
    _proj.scale = MAP_UNIT / Math.max(1e-6, (maxX - minX));
    this._bounds = { minX, maxX, minY, maxY };
  },

  // ── 省份挤出 ──
  _buildProvinces(geo) {
    // 顶面: 深蓝紫, 靠自发光维持底色, 光照只做明暗层次(避免被打亮成浅蓝)
    const topMat = new THREE.MeshPhongMaterial({
      color: 0x1b2247, emissive: 0x0d1428, emissiveIntensity: 0.75,
      shininess: 30, specular: 0x2b3a6e, flatShading: false
    });
    const sideMat = new THREE.MeshPhongMaterial({
      color: 0x141d3d, emissive: 0x0a1024, emissiveIntensity: 0.7,
      shininess: 8
    });
    const lineMat = new THREE.LineBasicMaterial({
      color: 0x7d93d6, transparent: true, opacity: 0.85
    });
    const outlinePts = [];      // 所有省的轮廓点(最后合并成一条线, 避免几百个 draw call)

    for (const f of geo.features) {
      const polys = f.geometry.type === 'Polygon'
        ? [f.geometry.coordinates]
        : f.geometry.coordinates;
      const shapes = [];
      for (const poly of polys) {
        if (!poly.length) continue;
        const outer = poly[0];
        if (outer.length < 3) continue;
        const shape = new THREE.Shape();
        outer.forEach((pt, i) => {
          const v = mapVec(pt[0], pt[1], 0);
          i ? shape.lineTo(v.x, v.z) : shape.moveTo(v.x, v.z);
        });
        // 内环(洞/飞地)
        for (let h = 1; h < poly.length; h++) {
          const ring = poly[h];
          if (ring.length < 3) continue;
          const hole = new THREE.Path();
          ring.forEach((pt, i) => {
            const v = mapVec(pt[0], pt[1], 0);
            i ? hole.lineTo(v.x, v.z) : hole.moveTo(v.x, v.z);
          });
          shape.holes.push(hole);
        }
        shapes.push(shape);
      }
      if (!shapes.length) continue;

      // 挤出: ExtrudeGeometry 沿 +Z 挤出, 转成沿 +Y(朝上)
      const geoms = [];
      for (const sh of shapes) {
        const g = new THREE.ExtrudeGeometry(sh, {
          depth: EXTRUDE_DEPTH, bevelEnabled: false, curveSegments: 1
        });
        g.rotateX(-Math.PI / 2);        // XY 平面 → XZ 平面, 挤出方向变成 +Y
        geoms.push(g);
      }
      // 合并同省的所有 polygon 为两个 mesh(顶面用材质组区分)
      const merged = this._mergeGeoms(geoms);
      // 材质组: ExtrudeGeometry 的第 0 组是顶/底面, 第 1 组是侧面
      const mesh = new THREE.Mesh(merged, [topMat, sideMat]);
      mesh.name = f.properties.name;
      mesh.userData.province = f.properties.name;
      mesh.userData.center = f.properties.center || f.properties.centroid;
      this.mapGroup.add(mesh);
      this.provinces.push(mesh);

      // 省界描边(顶面轮廓) —— 收集起来最后一次性合并
      for (const sh of shapes) {
        const pts = sh.getPoints(0);
        for (let i = 0; i < pts.length - 1; i++) {
          outlinePts.push(new THREE.Vector3(pts[i].x, EXTRUDE_DEPTH + 0.15, pts[i].y));
          outlinePts.push(new THREE.Vector3(pts[i+1].x, EXTRUDE_DEPTH + 0.15, pts[i+1].y));
        }
      }
    }
    // 一条 LineSegments 画完所有省界(1 个 draw call)
    if (outlinePts.length) {
      const lg = new THREE.BufferGeometry().setFromPoints(outlinePts);
      this.mapGroup.add(new THREE.LineSegments(lg, lineMat));
    }
    // 记录实际包围盒, 供相机适配距离使用
    const box = new THREE.Box3();
    this.provinces.forEach(p => box.expandByObject(p));
    const size = box.getSize(new THREE.Vector3());
    this._bbox = { halfW: Math.max(1, size.x / 2), halfD: Math.max(1, size.z / 2) };
    this._mapCenter = box.getCenter(new THREE.Vector3());
  },

  // 合并一个省的所有 ExtrudeGeometry → 单几何体, 只留 2 个材质组(顶面/侧面)
  // ★ ExtrudeGeometry 无 index; 且默认每个多边形各带 2 个组 → 339 个多边形会产生
  //   600+ 组 = 600+ draw call。这里按材质重排顶点, 压成 2 组。
  _mergeGeoms(geoms) {
    const top = { p: [], n: [], u: [] };
    const side = { p: [], n: [], u: [] };
    for (const g of geoms) {
      const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
      const gs = (g.groups && g.groups.length) ? g.groups
               : [{ start: 0, count: P.count, materialIndex: 0 }];
      for (const grp of gs) {
        const t = grp.materialIndex === 0 ? top : side;
        for (let i = grp.start; i < grp.start + grp.count; i++) {
          t.p.push(P.getX(i), P.getY(i), P.getZ(i));
          if (N) t.n.push(N.getX(i), N.getY(i), N.getZ(i));
          if (U) t.u.push(U.getX(i), U.getY(i));
        }
      }
    }
    const out = new THREE.BufferGeometry();
    const allP = new Float32Array(top.p.length + side.p.length);
    const allN = new Float32Array(top.n.length + side.n.length);
    const allU = new Float32Array(top.u.length + side.u.length);
    allP.set(top.p, 0);  allP.set(side.p, top.p.length);
    allN.set(top.n, 0);  allN.set(side.n, top.n.length);
    allU.set(top.u, 0);  allU.set(side.u, top.u.length);
    out.setAttribute('position', new THREE.BufferAttribute(allP, 3));
    out.setAttribute('normal',   new THREE.BufferAttribute(allN, 3));
    out.setAttribute('uv',       new THREE.BufferAttribute(allU, 2));
    const topCount = top.p.length / 3;
    if (topCount) out.addGroup(0, topCount, 0);
    if (side.p.length) out.addGroup(topCount, side.p.length / 3, 1);
    return out;
  },

  // ── 相机: 球坐标(绕地图中心转), 始终看向原点 ──
  _camPos() {
    const r = this.rig.dist;
    const st = Math.sin(this.rig.theta);
    const v = new THREE.Vector3(
      Math.sin(this.rig.phi) * st,
      Math.cos(this.rig.theta),
      Math.cos(this.rig.phi) * st
    ).multiplyScalar(r);
    // 相对注视点偏移(绕注视点转, 而不是绕原点)
    if (this._lookAt) { v.x += this._lookAt.x; v.z += this._lookAt.z; }
    return v;
  },

  // 照片 pin 跟随: 缓存 DOM 引用 + 只在坐标真变时写(每帧写 39 个元素会拖慢)
  _pinEls: null, _pinCache: null,
  _followPins() {
    if (!this._pinEls) {
      this._pinEls = [...document.querySelectorAll('.map-pin')];
      this._pinCache = new WeakMap();
      this._pinEls.forEach(el => {
        const c = CITIES.find(x => x.name === el.dataset.city);
        if (c) this._pinCache.set(el, c.coord);
      });
      this._centerOff = null;      // 居中补偿量(下一轮重算)
    }
    const cam = this.cam;
    // 第一遍: 算出所有可见 pin 的原始屏幕坐标
    const pts = [];
    for (const el of this._pinEls) {
      if (el.style.display === 'none') continue;
      const coord = this._pinCache.get(el);
      if (!coord) continue;
      const p = this.project(coord);
      pts.push({ el, p });
    }
    // 自动居中: 把照片群的包围盒中心挪到画面中心
    // 这是闭环补偿 —— 相机怎么转都能把照片群摆正, 不依赖手调参数
    if (pts.length) {
      const vis = pts.filter(t => t.p);
      if (vis.length) {
        const W = this._wrap.clientWidth, H = this._wrap.clientHeight;
        const xs = vis.map(t => t.p[0]), ys = vis.map(t => t.p[1]);
        const wantX = W / 2 - (Math.min(...xs) + Math.max(...xs)) / 2;
        const wantY = H / 2 - (Math.min(...ys) + Math.max(...ys)) / 2;
        // 平滑逼近, 避免拖拽时抖动
        const k = 0.18;
        if (!this._centerOff) this._centerOff = { x: wantX, y: wantY };
        else {
          this._centerOff.x += (wantX - this._centerOff.x) * k;
          this._centerOff.y += (wantY - this._centerOff.y) * k;
        }
      }
    }
    const off = this._centerOff || { x: 0, y: 0 };
    // 第二遍: 应用补偿 + 避让偏移, 写 DOM
    for (const { el, p } of pts) {
      if (!p) {
        if (el.style.visibility !== 'hidden') el.style.visibility = 'hidden';
        continue;
      }
      const x = Math.round(p[0] + (el._pinDX || 0) + off.x);
      const y = Math.round(p[1] + (el._pinDY || 0) + off.y);
      if (el._lastX !== x || el._lastY !== y) {
        el._lastX = x; el._lastY = y;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      }
      if (el.style.visibility === 'hidden') el.style.visibility = '';
    }
  },
  // renderOverlay 重建 pin 后要重置缓存(居中补偿让它重新收敛)
  resetPinCache() { this._pinEls = null; this._pinCache = null; this._centerOff = null; },

  // 让"半径 span 的范围"刚好铺满画面的相机距离(比 _fitDist 更通用)
  _distForSpan(span) {
    const W = this._wrap.clientWidth || 600, H = this._wrap.clientHeight || 600;
    const vFov = this.cam.fov * Math.PI / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * (W / H));
    const dV = span / Math.tan(vFov / 2);
    const dH = span / Math.tan(hFov / 2);
    return Math.max(dV, dH) * 1.05;
  },

  // 按视口算"地图刚好完整入框"的距离
  // 斜视角下地图在屏幕上的实际占比: 水平取地面半宽, 垂直取"半深×sin(俯角) + 厚度"
  _fitDist() {
    const W = this._wrap.clientWidth || 600, H = this._wrap.clientHeight || 600;
    const vFov = this.cam.fov * Math.PI / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * (W / H));
    const b = this._bbox || { halfW: MAP_UNIT / 2, halfD: MAP_UNIT / 2 };
    // 俯角越大(越接近俯视)垂直方向占地越小
    const sinT = Math.max(0.45, Math.sin(this.rig.theta));
    const halfV = b.halfD * sinT + EXTRUDE_DEPTH;
    const dV = halfV / Math.tan(vFov / 2);
    const dH = b.halfW / Math.tan(hFov / 2);
    return Math.max(dV, dH) * FIT_MARGIN;
  },

  _loop() {
    const tick = () => {
      this._raf = requestAnimationFrame(tick);
      if (this._tween) {
        const t = Math.min(1, (performance.now() - this._tween.t0) / this._tween.ms);
        const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
        const T = this._tween;
        this.rig.phi   = T.f0.phi   + (T.t1.phi   - T.f0.phi)   * e;
        this.rig.theta = T.f0.theta + (T.t1.theta - T.f0.theta) * e;
        this.rig.dist  = T.f0.dist  + (T.t1.dist  - T.f0.dist)  * e;
        if (t >= 1) this._tween = null;
      } else if (!this._drag && this._spin) {
        this.rig.phi += 0.0011 * this._spin;
        this._lastCenter = null;
      }
      this.cam.position.copy(this._camPos());
      // 看向原点; 地图整体已按足迹重心平移过(mapGroup.position), 所以这样就是居中
      this.cam.lookAt(0, 0, 0);
      this.cam.updateMatrixWorld();
      this.renderer.render(this.scene, this.cam);
      this._followPins();          // 照片 pin 每帧跟随(只做坐标加法, 很轻)
    };
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = requestAnimationFrame(tick);
  },

  // ── 输入 ──
  _bindInput() {
    const cv = this.renderer.domElement;
    const pt = e => ({ x: e.clientX, y: e.clientY });

    cv.addEventListener('pointerdown', e => {
      this._tween = null;
      if (e.button !== 0) return;
      this._drag = pt(e); this._lastPt = pt(e);
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
      cv.style.cursor = 'grabbing';
    });
    cv.addEventListener('pointermove', e => {
      if (this._drag) {
        const dx = e.clientX - this._lastPt.x, dy = e.clientY - this._lastPt.y;
        this._lastPt = pt(e);
        if (Math.abs(dx) + Math.abs(dy) < 0.4) return;
        this.rig.phi += dx * 0.0062;
        this.rig.theta = Math.max(0.12 * Math.PI, Math.min(0.86 * Math.PI, this.rig.theta - dy * 0.0048));
        Object.assign(this.rigTgt, this.rig);
        this._lastCenter = null;
        this._fireRoam();
        return;
      }
      // 悬停: 射线拾取省份
      this._hoverPick(e);
    });
    const endDrag = () => {
      if (!this._drag) return;
      this._drag = null; cv.style.cursor = 'grab';
      this._fireRoam();
    };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', endDrag);
    cv.style.cursor = 'grab';

    // 滚轮缩放
    cv.addEventListener('wheel', e => {
      e.preventDefault(); this._tween = null;
      // 下钳到比初始更近, 上钳到全国视角(能拉回看全图)
      const lo = Math.min(this.rig.dist * 0.8, this._defaultDist * 0.30), hi = this._defaultDist * 1.15;
      this.rig.dist = Math.max(lo, Math.min(hi, this.rig.dist * (1 + e.deltaY * 0.0013)));
      Object.assign(this.rigTgt, this.rig);
      this._lastCenter = null;
      this._fireRoam();
    }, { passive: false });

    // 双指捏合
    cv.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      e.preventDefault(); this._tween = null;
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      if (this._pinch) {
        // 下钳到比初始更近, 上钳到全国视角(能拉回看全图)
      const lo = Math.min(this.rig.dist * 0.8, this._defaultDist * 0.30), hi = this._defaultDist * 1.15;
        this.rig.dist = Math.max(lo, Math.min(hi, this.rig.dist * (this._pinch / d)));
        Object.assign(this.rigTgt, this.rig);
        this._lastCenter = null;
        this._fireRoam();
      }
      this._pinch = d;
    }, { passive: false });
    cv.addEventListener('touchend', () => { this._pinch = 0; });

    // 点击: 屏幕距离最近的城市(比 raycast 更省)
    cv.addEventListener('click', e => {
      if (!this._clickFn) return;
      const r = cv.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      let best = null, bestD = 26;
      for (const name in this.marks) {
        const p = this.project(this.marks[name].city.coord);
        if (!p) continue;
        const d = Math.hypot(p[0] - mx, p[1] - my);
        if (d < bestD) { bestD = d; best = name; }
      }
      if (best) this._clickFn({ seriesType: 'effectScatter', name: best });
    });

    // 双击: 复位到初始视角(推近到足迹区)
    cv.addEventListener('dblclick', e => {
      e.preventDefault();
      this.resetView();
    });

    // 键盘: 方向键旋转, +/- 缩放(无障碍 + 桌面顺手)
    cv.tabIndex = 0;                       // 让 canvas 可聚焦
    cv.addEventListener('keydown', e => {
      const step = 0.09, dstep = 1.12;
      let handled = true;
      switch (e.key) {
        case 'ArrowLeft':  this.rig.phi -= step; break;
        case 'ArrowRight': this.rig.phi += step; break;
        case 'ArrowUp':    this.rig.theta = Math.max(0.12*Math.PI, this.rig.theta - step); break;
        case 'ArrowDown':  this.rig.theta = Math.min(0.86*Math.PI, this.rig.theta + step); break;
        case '+': case '=':
          this.rig.dist = Math.max(this._defaultDist*0.30, this.rig.dist / dstep); break;
        case '-': case '_':
          this.rig.dist = Math.min(this._defaultDist*1.15, this.rig.dist * dstep); break;
        case 'r': case 'R': this.resetView(); break;
        default: handled = false;
      }
      if (handled) {
        e.preventDefault();
        this._tween = null;
        Object.assign(this.rigTgt, this.rig);
        this._lastCenter = null;
        this._fireRoam();
      }
    });
  },

  // 复位: 回到"推近到足迹区"的初始视角
  resetView() {
    if (!this._ready || !this._homeCenter) return;
    const h = this._homeCenter;
    this.rig.phi = Math.atan2(h.x, h.z);
    this.rig.theta = 0.61;                   // 与初始俯角一致
    this.rig.dist = this._distForSpan(h.span);
    const halfFov = this.cam.fov * Math.PI / 360;
    const back = 0.22 * this.rig.dist * Math.tan(halfFov) * 2;
    this._lookAt = { x: h.x + Math.sin(this.rig.phi) * back,
                     z: h.z + Math.cos(this.rig.phi) * back };
    Object.assign(this.rigTgt, this.rig);
    this._lastCenter = null;
    this._fireRoam();
  },

  // 悬停省份高亮
  _hoverPick(e) {
    const cv = this.renderer.domElement;
    const r = cv.getBoundingClientRect();
    this._mouse.set(((e.clientX - r.left) / r.width) * 2 - 1,
                    -((e.clientY - r.top) / r.height) * 2 + 1);
    this._raycaster.setFromCamera(this._mouse, this.cam);
    const hits = this._raycaster.intersectObjects(this.provinces, false);
    const name = hits.length ? hits[0].object.userData.province : null;
    if (name === this._hoverName) return;
    // 还原上一个
    if (this._hoverName) {
      const prev = this.provinces.find(p => p.userData.province === this._hoverName);
      if (prev) prev.position.y = 0;
    }
    this._hoverName = name;
    if (name) {
      const cur = this.provinces.find(p => p.userData.province === name);
      if (cur) cur.position.y = 3.5;       // 抬起, 立体感
      cv.style.cursor = 'pointer';
    } else {
      cv.style.cursor = this._drag ? 'grabbing' : 'grab';
    }
  },

  _fireRoam() {
    if (this._roamTimer) clearTimeout(this._roamTimer);
    this._roamTimer = setTimeout(() => { if (this._roamFn) this._roamFn(); }, 80);
  },

  // ── MapAPI 契约 ──
  // 经纬度 → 屏幕像素 [x,y]; 屏外返回 null
  project(coord) {
    if (!this._ready || !this.cam) return null;
    // 保险: 相机若还在原点(后台标签页 RAF 未跑), 先摆正再算
    if (this.cam.position.lengthSq() < 1) {
      this.cam.position.copy(this._camPos());
      this.cam.lookAt(0, 0, 0);
      this.cam.updateMatrixWorld();
    }
    const p = mapVec(coord[0], coord[1], EXTRUDE_DEPTH + 2);
    // 加上地图整体的平移(足迹重心已移到原点)
    const g = this.mapGroup ? this.mapGroup.position : null;
    if (g) { p.x += g.x; p.z += g.z; }
    const v = p.clone().project(this.cam);
    if (v.z > 1) return null;
    const W = this._wrap.clientWidth, H = this._wrap.clientHeight;
    const x = (v.x * 0.5 + 0.5) * W, y = (-v.y * 0.5 + 0.5) * H;
    if (x < -80 || x > W + 80 || y < -80 || y > H + 80) return null;
    return [x, y];
  },

  // 平面地图没有背面概念
  isVisible() { return this._ready; },

  getZoom() {
    // 基线 1.55 对齐 echarts; _defaultDist = 全国视角距离(拉远的上限)
    // 初始推近到足迹区时约 1.9~2.4, 拉近到 0.5× 得 3.1 > 2.5 ✓ 触发小 pin 升格
    return 1.55 * (this._defaultDist / this.rig.dist);
  },

  getCenter() {
    if (!this._ready) return null;
    // 用相机水平方位反推视线落点(近似取地图中心往相机方向偏移)
    const ll = this._lastCenter || this._computeCenter();
    return ll;
  },
  _computeCenter() {
    const d = this.rig.dist;
    const t = Math.min(0.92, (d - this._defaultDist * 0.42) / (this._defaultDist * 1.8));
    // 距离越近, 视线中心越靠相机方位对应的点
    const dir = new THREE.Vector3(Math.sin(this.rig.phi), 0, Math.cos(this.rig.phi));
    const pt = dir.multiplyScalar(MAP_UNIT * 0.45 * t);
    const ll = mapToLonLat(pt);
    this._lastCenter = ll;
    return ll;
  },

  setCenter(c) {
    if (!this._ready) return;
    const v = mapVec(c[0], c[1], 0);
    this.rig.phi = Math.atan2(v.x, v.z);
    Object.assign(this.rigTgt, this.rig);
    this._lastCenter = null;
  },

  // 高亮: 只脉冲(pin 层的效果), 不运镜
  highlight(name) {
    const m = this.marks[name];
    if (!m || !m.sprite) return;
    const base = m.baseScale, t0 = performance.now();
    const pulse = () => {
      const t = (performance.now() - t0) / 1400;
      if (t >= 1) { m.sprite.scale.setScalar(base); return; }
      m.sprite.scale.setScalar(base * (1 + 1.1 * Math.sin(Math.PI * t)));
      requestAnimationFrame(pulse);
    };
    pulse();
    // 省份也抬一下
    const prov = this.provinces.find(p => p.name === name ||
      (name && p.userData.province && p.userData.province.indexOf(name) >= 0));
    if (prov) {
      const t2 = performance.now();
      const rise = () => {
        const t = (performance.now() - t2) / 1400;
        if (t >= 1) { prov.position.y = 0; return; }
        prov.position.y = 4 * Math.sin(Math.PI * t);
        requestAnimationFrame(rise);
      };
      rise();
    }
  },

  onRoam(fn) { this._roamFn = fn; },
  onClick(fn) { this._clickFn = fn; },

  resize() {
    if (!this._ready) return;
    const W = this._wrap.clientWidth, H = this._wrap.clientHeight;
    if (!W || !H) return;
    this.renderer.setSize(W, H, false);
    this.cam.aspect = W / H;
    this.cam.updateProjectionMatrix();
    const old = this._defaultDist;
    this._defaultDist = this._fitDist();
    if (old > 0) {
      const k = this._defaultDist / old;
      this.rig.dist *= k; this.rigTgt.dist *= k;
      if (this._tween) { this._tween.f0.dist *= k; this._tween.t1.dist *= k; }
    }
  },

  // ── 3D 专属 ──
  flyTo(name, opts) {
    const c = CITIES.find(x => x.name === name);
    if (!c || !this._ready) return;
    const o = opts || {};
    const v = mapVec(c.coord[0], c.coord[1], 0);
    const g = this.mapGroup ? this.mapGroup.position : null;
    if (g) { v.x += g.x; v.z += g.z; }          // 补偿地图平移
    let phi = Math.atan2(v.x, v.z);
    const f = this.rig;
    let dPhi = ((phi - f.phi + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    this._tween = {
      f0: { phi: f.phi, theta: f.theta, dist: f.dist },
      t1: { phi: f.phi + dPhi, theta: Math.max(0.2, Math.min(0.5, f.theta)), dist: this._defaultDist * 0.55 },
      t0: performance.now(), ms: o.ms || 1000
    };
    Object.assign(this.rigTgt, this._tween.t1);
    this._lastCenter = null;
  },

  // 足迹点
  addMark(city, color) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this._dotTex(), color: new THREE.Color(color),
      transparent: true, depthWrite: false, depthTest: false,
      blending: THREE.AdditiveBlending
    }));
    sp.position.copy(mapVec(city.coord[0], city.coord[1], EXTRUDE_DEPTH + 3));
    const base = 9;
    sp.scale.setScalar(base);
    sp.renderOrder = 10;
    this.mapGroup.add(sp);
    this.marks[city.name] = { sprite: sp, city, baseScale: base };
    return sp;
  },

  // 航线: 家 → 各城的空间弧线(抬高, 不穿过地面)
  // 合并成一个 LineSegments, 1 个 draw call; 支持逐个点亮
  buildRoutes(home, others) {
    const pts = [], colors = [], spans = [];
    const a = mapVec(home.coord[0], home.coord[1], EXTRUDE_DEPTH);
    const cTmp = new THREE.Color();
    others.forEach((c, i) => {
      const b = mapVec(c.coord[0], c.coord[1], EXTRUDE_DEPTH);
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const chord = a.distanceTo(b);
      const ctrl = mid.clone();
      ctrl.y += chord * 0.30 + 12;          // 顶点抬高 → 拱形
      const SEG = 22;
      cTmp.set(RAINBOW[i % RAINBOW.length]);
      const startIdx = pts.length;
      for (let k = 0; k < SEG; k++) {
        const t0 = k / SEG, t1 = (k + 1) / SEG;
        const p0 = this._bez(a, ctrl, b, t0), p1 = this._bez(a, ctrl, b, t1);
        pts.push(p0, p1);
        for (let m = 0; m < 2; m++) colors.push(cTmp.r, cTmp.g, cTmp.b);
      }
      spans.push({ start: startIdx, end: pts.length, city: c.name });
    });
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const line = new THREE.LineSegments(geo, mat);
    line.renderOrder = 5;
    this.mapGroup.add(line);
    this.routes = { line, spans, groups: {} };
    return line;
  },
  _bez(a, c, b, t) {
    const u = 1 - t;
    return new THREE.Vector3(
      u*u*a.x + 2*u*t*c.x + t*t*b.x,
      u*u*a.y + 2*u*t*c.y + t*t*b.y,
      u*u*a.z + 2*u*t*c.z + t*t*b.z
    );
  },
  // 逐条点亮航线: 用 drawRange 控制已显示的线段数
  revealRoutes(n) {
    if (!this.routes) return;
    const total = this.routes.spans.length ? this.routes.spans[this.routes.spans.length-1].end : 0;
    const upto = n >= this.routes.spans.length ? total
               : (n > 0 ? this.routes.spans[n-1].end : 0);
    this.routes.line.geometry.setDrawRange(0, upto);
    this.routes.line.material.opacity = n > 0 ? 0.55 : 0;
  },

  _dotTexCache: null,
  _dotTex() {
    if (this._dotTexCache) return this._dotTexCache;
    const S = 64, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,255,255,0.9)');
    grd.addColorStop(0.7, 'rgba(255,255,255,0.25)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, S, S);
    this._dotTexCache = new THREE.CanvasTexture(cv);
    return this._dotTexCache;
  },
};


// ── 地图 ──
let chart = null, geoLoaded = false, frame = 0, timer = null;
// 后端选择: 'three' = 3D 地球 | 'echarts' = 2D 中国地图(备用/低端机回退)
// WebGL 不可用时自动降级到 echarts
let MAP_BACKEND = localStorage.getItem('yuebing_map_backend') || 'three';

function renderMap() {
  const el = document.getElementById('map');
  // 依赖按需加载: 默认只拉 three; echarts 仅在没有 WebGL 时才需要
  if (MAP_BACKEND === 'three') {
    window._dep.loadThree().then(() => {
      if (typeof THREE === 'undefined') { MAP_BACKEND = 'echarts'; renderMap(); return; }
      document.querySelector('.map-row').classList.add('map-3d');   // 触发 3D 版 pin 样式
      MapAPI.mount(ThreeBackend, el, {
        onReady: () => {
          if (!ThreeBackend.ready()) {          // WebGL 检测没过 → 回退
            MAP_BACKEND = 'echarts';
            renderMap();
            return;
          }
          startGlobeOpening();
        }
      });
    }).catch(() => {
      el.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#aab0d0">地图脚本加载失败（网络异常）<br>右侧城市墙正常可用</div>';
    });
    return;
  }
  // echarts 后端内部会 init/registerMap; 就绪后回调 startAnimation 画开屏动画
  window._dep.loadEcharts().then(() => {
    if (typeof echarts === 'undefined') {
      el.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#aab0d0">地图脚本加载失败（网络异常）<br>右侧城市墙正常可用</div>';
      return;
    }
    MapAPI.mount(EchartsBackend, el, {
      onReady: () => { chart = EchartsBackend.chart; startAnimation(); },
    });
  }).catch(() => {
    el.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#aab0d0">地图脚本加载失败（网络异常）<br>右侧城市墙正常可用</div>';
  });
}

// ── 3D 版开屏: 足迹点逐个点亮 → 航线浮现 → 照片 pin 上屏 → 烟花 ──
function startGlobeOpening() {
  const home = CITIES.find(c => c.home);
  const others = CITIES.filter(c => !c.home);
  // 足迹点(全部城市, 含无照片的)
  CITIES.forEach((c, i) => ThreeBackend.addMark(c, RAINBOW[i % RAINBOW.length]));
  ThreeBackend.buildRoutes(home, others);
  ThreeBackend.revealRoutes(0);
  // 初始全部隐藏
  Object.values(ThreeBackend.marks).forEach(m => { m.sprite.visible = false; });

  // 照片层先建好; pin 初始 opacity:0(CSS), 由 lit 逐个点亮
  // ★ 顺序要紧: 必须"先 renderOverlay 再点亮", 反了会被重建冲掉(老板 09-16 反馈缩略图消失)
  renderOverlay();
  const litPins = names => {
    const set = names instanceof Set ? names : new Set(names);
    document.querySelectorAll('.map-pin').forEach(p => {
      if (set.has(p.dataset.city)) p.classList.add('lit');
    });
  };

  const REVEAL_MS = 135;                 // 与 2D 版一致(老板认可的开屏节奏)
  const t0 = performance.now();
  const litCities = new Set([home.name]);
  let idx = 0;
  const timer = setInterval(() => {
    const target = Math.min(others.length, Math.floor((performance.now() - t0) / REVEAL_MS));
    if (target > idx) idx = target; else idx++;
    if (idx >= others.length) {
      clearInterval(timer);
      // 收尾: 全部点 + 航线 + 全部照片
      CITIES.forEach(c => { const m = ThreeBackend.marks[c.name]; if (m) m.sprite.visible = true; });
      ThreeBackend.revealRoutes(others.length);
      litPins(CITIES.map(c => c.name));
      setTimeout(() => fireworkBurst(home.coord), 350);
      return;
    }
    for (let i = 0; i < idx; i++) {
      const c = others[i];
      const m = ThreeBackend.marks[c.name];
      if (m) m.sprite.visible = true;
      litCities.add(c.name);
    }
    ThreeBackend.revealRoutes(idx);
    litPins(litCities);
  }, 160);

  // 兜底: 标签页在后台时 setInterval 被节流, 3.5 秒后无论如何全亮
  setTimeout(() => litPins(CITIES.map(c => c.name)), 3500);

  MapAPI.onClick(p => {
    if (p.seriesType === 'effectScatter' && p.name) {
      if (p.name !== home.name && photoCount(p.name)) { openLightbox(p.name); return; }
      highlightCity(p.name);
    }
  });
  MapAPI.onRoam(repositionOverlay);
}

function startAnimation() {
  const home = CITIES.find(c => c.home);
  const others = CITIES.filter(c => !c.home);

  const option = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: p => {
        if (p.seriesType !== 'effectScatter') return p.name;
        const c = CITIES.find(x => x.name === p.name);
        if (!c) return p.name;
        const since = sinceOf(c.name);
        const n = photoCount(c.name);
        const note = noteOf(c.name);
        let lines = '';
        if (c.home) lines += '🏠 家 · 从这里出发<br/>';
        if (since) lines += `🕐 首访 ${since}<br/>`;
        if (n) lines += `📷 ${n} 张照片<br/>`;
        if (note) lines += `💬 ${note}<br/>`;
        if (!lines) lines = `🗺️ ${c.prov} · 待补记忆<br/>`;
        return `<b>${p.name}</b><br/>${lines}`;
      },
      backgroundColor: '#1c1f33', borderColor: '#ffd166', textStyle: {color:'#f2f4ff'}
    },
    geo: {
      map: 'china', roam: true,
      zoom: 1.55,  // 足迹密集区为主体, 没去过的地方放地图边缘(老板 2026-09-15)
      center: [110, 36],  // 重心: 足迹主覆盖区(华北-华中-陕川)
      scaleLimit: { min: 0.9, max: 7 },  // 防缩放大后地图漂出画布留白(2026-09-15 修复)
      itemStyle: {
        areaColor: new echarts.graphic.LinearGradient(0,0,0,1,[
          {offset:0,color:'#232a4d'},{offset:1,color:'#181c33'}
        ]),
        borderColor: '#4a557f', borderWidth: 1,
        shadowColor: 'rgba(122,140,255,.25)', shadowBlur: 14
      },
      emphasis: { itemStyle: { areaColor: '#2d3560' }, label: { show:false } },
      label: { show:false }
    },
    series: [
      // 1) 家 —— 彩虹脉冲
      {
        id: 'home1',
        type: 'effectScatter', coordinateSystem: 'geo', zlevel: 4,
        data: [{name: home.name, value: [...home.coord, 30]}],
        symbolSize: v => v[2], rippleEffect: { brushType:'stroke', scale: 5, period: 3 },
        itemStyle: {
          color: new echarts.graphic.RadialGradient(.5,.5,.6,[
            {offset:0,color:'#fff'},{offset:.4,color:'#ffd166'},{offset:1,color:'rgba(255,93,143,0)'}
          ]),
          shadowBlur: 24, shadowColor: '#ffd166'
        },
        label: { show:true, position:'right', formatter:'🏠 北京', color:'#ffd166', fontSize:13, fontWeight:'bold' }
      },
      // 2) 足迹点 —— 彩色呼吸 + 相册徽章
      {
        id: 'scatter1',
        type: 'effectScatter', coordinateSystem: 'geo', zlevel: 3,
        data: others.map((c,i) => ({
          name: c.name, value: [...c.coord, 15 + Math.sin(i*1.7)*3],
          itemStyle: { color: RAINBOW[i % RAINBOW.length] },
          hasPhoto: !!photoCount(c.name)
        })),
        symbolSize: v => v[2], rippleEffect: { brushType:'stroke', scale: 3.2, period: 4 },
        itemStyle: {
          shadowBlur: 12, shadowColor: 'rgba(255,209,102,.55)'
        },
        label: {
          show: true, position: 'top', formatter: p => {
            const has = p.data && p.data.hasPhoto;
            return '{b}' + (has ? ' 📷' : '');
          },
          color: '#f2f4ff', fontSize: 10
        }
      },
      // 3) 家 → 各城 彩虹航线（按访问次序逐条点亮）
      {
        id: 'lines1',
        type: 'lines', coordinateSystem: 'geo', zlevel: 2, silent: true,
        data: others.map((c,i) => ({
          fromName: home.name, toName: c.name,
          coords: [home.coord, c.coord],
          lineStyle: { color: RAINBOW[i % RAINBOW.length], width: 1.4, opacity: .55, curveness: .18 }
        })),
        effect: {
          show: true, period: 5, trailLength: .35, symbolSize: 5,
          color: '#fff', loop: true
        }
      }
    ]
  };
  chart.setOption(option);

  // 开屏动画: 地图渐显 + 足迹点像烟花逐个点亮(不弹 tooltip 抢视线)
  const scatterData = others;
  let idx = 0;
  const revealInterval = 135;  // 37 个点 × 135ms ≈ 5 秒亮完(老板拍板 2026-09-15)
  // 先把所有足迹点隐藏, 逐个点亮
  const tmpData = scatterData.map(c => ({ ...c, value: [...c.coord, 0] }));
  chart.setOption({ series: [{ id: 'scatter1', data: tmpData }] });
  // 航线和光点也延迟出现
  chart.setOption({ series: [{ id: 'lines1', data: [] }] });
  chart.setOption({ series: [{ id: 'home1', data: [] }] });

  // 时间戳驱动: 后台标签页 setInterval 被节流时, 每 tick 按实际经过时间补点亮多个点
  const revealStart = Date.now();
  timer = setInterval(() => {
    const elapsed = Date.now() - revealStart;
    const target = Math.min(scatterData.length, Math.floor(elapsed / revealInterval));
    if (target > idx) idx = target;
    else idx++;
    if (idx >= scatterData.length) {
      clearInterval(timer); timer = null;
      // 收尾: 足迹点补满 + 家的光点 + 航线全部浮现
      const fullScatter = scatterData.map(c => ({ ...c, value: [...c.coord, 15 + Math.sin(scatterData.indexOf(c)*1.7)*3] }));
      chart.setOption({ series: [
        { id: 'scatter1', data: fullScatter },
        { id: 'home1', data: [{name: home.name, value: [...home.coord, 30]}] },
        { id: 'lines1', data: others.map((c,i) => ({
          fromName: home.name, toName: c.name,
          coords: [home.coord, c.coord],
          lineStyle: { color: RAINBOW[i % RAINBOW.length], width: 1.4, opacity: .55, curveness: .18 }
        })) }
      ] });
      // 收尾: 剩余照片 pin 全点亮
      document.querySelectorAll('.map-pin').forEach(p => p.classList.add('lit'));
      // 烟花绽放: 在"家"上空绽放
      setTimeout(() => fireworkBurst(home.coord), 350);
      return;
    }
    // 点亮到当前进度 + 同步点亮已亮地点的照片 pin
    const lit = scatterData.slice(0, idx).map(c => ({ ...c, value: [...c.coord, 15 + Math.sin(scatterData.indexOf(c)*1.7)*3] }));
    chart.setOption({ series: [{ id: 'scatter1', data: lit }] });
    lit.forEach(c => {
      const pin = Array.from(document.querySelectorAll('.map-pin'))
                      .find(p => p.querySelector('img').alt === c.name);
      if (pin) pin.classList.add('lit');
    });
  }, 200);

  MapAPI.onClick(p => {
    if (p.seriesType === 'effectScatter' && p.name) {
      if (p.name !== home.name && photoCount(p.name)) { openLightbox(p.name); return; }
      highlightCity(p.name);
    }
  });

  // 地图缩放/平移后重定位浮层照片
  MapAPI.onRoam(repositionOverlay);

  // 照片浮层上屏
  renderOverlay();
}

// ── 🎆 烟花绽放: canvas 粒子系统, 在地图"家"坐标上空炸开 ──
const FIREWORK_COLORS = ['#ffd166','#ff5d8f','#7bf1a8','#4fd1ff','#c084fc','#ff9e5e','#ffffff'];
let fwCanvas = null, fwCtx = null, fwParts = [], fwRunning = false, fwTimer = null, fwLastTick = 0;

function ensureFwCanvas() {
  if (fwCanvas) return;
  const wrap = document.getElementById('map-wrap');
  fwCanvas = document.createElement('canvas');
  fwCanvas.style.cssText = 'position:absolute;inset:0;z-index:5;pointer-events:none;';
  wrap.appendChild(fwCanvas);
  const resize = () => {
    fwCanvas.width = wrap.clientWidth;
    fwCanvas.height = wrap.clientHeight;
  };
  resize();
  window.addEventListener('resize', resize);
  fwCtx = fwCanvas.getContext('2d');
}

let fwFinalPhotoShown = false, fwBurstChain = null;

function fireworkBurst(coord) {
  ensureFwCanvas();
  // 地图坐标 → 画布像素
  const px = MapAPI.project(coord);
  if (!px) return;
  const cx = px[0], cy = px[1];
  fwFinalPhotoShown = false;
  // 三连炸: 第一波立即发, 后两波用时间戳驱动的链式 setTimeout
  const styles = FW_STYLES.sort(() => Math.random() - 0.5).slice(0, 3);
  launchOne(cx, cy, 70, styles[0]);  // 立即第一炸
  let burst = 1;
  const nextBurst = (start) => {
    if (burst >= 3) return;
    const wait = burst * 450 - (Date.now() - start);
    fwBurstChain = setTimeout(() => {
      launchOne(cx, cy, 70 + burst * 25, styles[burst]);
      burst++;
      nextBurst(start);
    }, Math.max(0, wait));
  };
  nextBurst(Date.now());
}

// 烟花收尾: 随机一张照片浮现, 显示 3 秒后消失
function showRandomFinalPhoto() {
  const cities = theaterCitiesWithPhotos();
  const c = cities[Math.floor(Math.random() * cities.length)];
  const imgs = photoImgs(c.name);
  const img = imgs[Math.floor(Math.random() * imgs.length)];
  const overlay = document.createElement('div');
  overlay.style.cssText = `

  // 加 keyframes(动态注入)

    st.textContent = `

        100% { opacity:1; transform: scale(1); }

// 烟花样式库: 圆环/双色/心形/螺旋, 随机选用
const FW_STYLES = ['ring', 'dual', 'heart', 'spiral', 'bloom'];

function launchOne(cx, cy, count, styleOverride) {
  const style = styleOverride || FW_STYLES[Math.floor(Math.random() * FW_STYLES.length)];
  const color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
  const color2 = FIREWORK_COLORS[(FIREWORK_COLORS.indexOf(color) + 3) % FIREWORK_COLORS.length];
  const push = (vx, vy, size, col) => {
    fwParts.push({
      x: cx, y: cy, vx, vy,
      life: 1,
      decay: 0.012 + Math.random() * 0.014,
      size, color: col,
    });
  };
  if (style === 'ring') {
    // 完美圆环: 均匀角度 + 等速
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const sp = 3.2;
      push(Math.cos(a) * sp, Math.sin(a) * sp, 2, color);
    }
  } else if (style === 'dual') {
    // 双色交错: 内外两环
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const sp = i % 2 === 0 ? 2.4 : 4.0;
      push(Math.cos(a) * sp, Math.sin(a) * sp, 1.8, i % 2 === 0 ? color : color2);
    }
  } else if (style === 'heart') {
    // 心形参数方程
    for (let i = 0; i < count; i++) {
      const t = (i / count) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      push(x * 0.22, -y * 0.22, 1.8, color);
    }
  } else if (style === 'spiral') {
    // 螺旋: 角度递进 + 速度递增
    for (let i = 0; i < count; i++) {
      const a = i * 0.35;
      const sp = 1.2 + i * 0.05;
      push(Math.cos(a) * sp, Math.sin(a) * sp, 1.5, color);
    }
  } else {
    // bloom: 经典球形散开
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 3.5;
      push(Math.cos(a) * sp, Math.sin(a) * sp - 0.6, 1.5 + Math.random() * 2, color);
    }
  }
  if (!fwRunning) {
    fwRunning = true;
    fwLastTick = Date.now();
    fwTimer = setInterval(fwTick, 33);
  }
}

function fwTick() {
  const now = Date.now();
  const dt = Math.min(100, now - fwLastTick) / 16.7;  // 帧数换算, 封顶防跳变
  fwLastTick = now;
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  fwParts = fwParts.filter(p => p.life > 0);
  for (const p of fwParts) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.03 * dt;   // 重力
    p.vx *= Math.pow(0.985, dt);  // 空气阻力
    p.vy *= Math.pow(0.985, dt);
    p.life -= p.decay * dt;
    fwCtx.globalAlpha = Math.max(0, p.life);
    fwCtx.fillStyle = p.color;
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    fwCtx.fill();
    // 拖尾光晕
    fwCtx.globalAlpha = Math.max(0, p.life * 0.35);
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
    fwCtx.fill();
  }
  fwCtx.globalAlpha = 1;
  if (fwParts.length === 0) {
    clearInterval(fwTimer);
    fwTimer = null;
    fwRunning = false;
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    // 烟花粒子全部飞完 → 随机一张月饼照片收尾
    if (!fwFinalPhotoShown) {
      fwFinalPhotoShown = true;
      showRandomFinalPhoto();
    }
  }
}

let mapZoomLevel = 1;

function renderOverlay() {

// ── pin 避让布局: 照片多的优先占住锚点, 被挤的沿黄金角螺旋外推 ──
// 目的: 39 个地点全部露出缩略图, 又不糊成一坨(老板 2026-09-15 晚)
function layoutPins() {
  if (!MapAPI.ready()) return;
  const wrap = document.getElementById('map-wrap');
  const wrapW = wrap.clientWidth, wrapH = wrap.clientHeight;
  const narrow = wrapW < 560;   // 窄屏只排大 pin(其余隐藏, 见 applyZoomFold)
  // 3D 模式: 照片直接钉在城市投影点上, 不做避让(老板 09-16 拍板)
  if (MAP_BACKEND === 'three') {
    document.querySelectorAll('.map-pin').forEach(el => {
      const c = CITIES.find(x => x.name === el.dataset.city);
      if (!c) return;
      const px = MapAPI.project(c.coord);
      if (!px) { el.style.visibility = 'hidden'; return; }
      el.style.visibility = '';
      el._pinDX = 0; el._pinDY = 0;             // 无避让偏移
      el._pinAnchor = [px[0], px[1]];
      el.style.left = px[0] + 'px';
      el.style.top  = px[1] + 'px';
    });
    return;
  }
  const items = [];
  document.querySelectorAll('.map-pin').forEach(el => {
    if (narrow && !el.classList.contains('big')) return;
    const c = CITIES.find(x => x.name === el.dataset.city);
    if (!c) return;
    const px = MapAPI.project(c.coord);
    if (!px) return;
    items.push({ el, count: photoCount(c.name), ax: px[0], ay: px[1] });
  });
  // 照片多的先占位(视觉主体不挪窝), 少的让位
  items.sort((a, b) => b.count - a.count);
  const placed = [];
  items.forEach(p => {
    const r = (p.el.offsetWidth || 26) / 2;
    let x = p.ax, y = p.ay, best = null, bestD = 0;
    // 沿黄金角螺旋外推找一个不撞的位置; 找不到就用"离最近邻居最远"的那个
    for (let k = 1; k <= 60; k++) {
      const ang = k * 2.39996;
      const rad = 5 * Math.sqrt(k) * 2.6;
      x = Math.max(r + 2, Math.min(wrapW - r - 2, p.ax + Math.cos(ang) * rad));
      y = Math.max(r + 2, Math.min(wrapH - r - 2, p.ay + Math.sin(ang) * rad));
      const minGap = placed.length
        ? Math.min(...placed.map(q => Math.hypot(q.x - x, q.y - y) - (q.r + r)))
        : 999;
      if (minGap > 1.5) { best = { x, y }; break; }
      if (minGap > bestD) { bestD = minGap; best = { x, y }; }
    }
    if (best) { x = best.x; y = best.y; }
    placed.push({ x, y, r });
    // 记录"相对投影点的偏移", 供每帧快速跟随(3D 拖动时用)
    p.el._pinDX = x - p.ax;
    p.el._pinDY = y - p.ay;
    p.el._pinAnchor = [p.ax, p.ay];
    p.el.style.left = x + 'px';
    p.el.style.top = y + 'px';
  });
}

// ── 底部胶片条 ──
function renderFilmStrip() {
  const strip = document.getElementById('film-strip');
  const row = document.getElementById('fs-row');
  const pinCities = CITIES.filter(c => photoCount(c.name) > 0);
  if (!pinCities.length) { strip.style.display = 'none'; return; }
  strip.style.display = '';
  // 按首访时间排序
  const ordered = [...pinCities].sort((a, b) => {
    const ea = loadEdits()[a.name] || {};
    const eb = loadEdits()[b.name] || {};
    return (ea.since || a.since || '9999').localeCompare(eb.since || b.since || '9999');
  });
  row.innerHTML = ordered.map(c => {
    const imgs = photoImgs(c.name);
    const cover = randomPhotoCover(c.name);
    const nVid = imgs.filter(isVideo).length;
    const title = `${c.name}（${imgs.length} 个媒体${nVid ? `, 视频 ${nVid}` : ''}）`;
    return `<div class="fs-cell" data-city="${c.name}" title="${title}">
      <img src="${cover}" alt="${c.name}" loading="lazy">
      <div class="fs-city">${c.name}</div>
    </div>`;
  }).join('');
  row.querySelectorAll('.fs-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const city = cell.dataset.city;
      // 定位地图
      const c = CITIES.find(x => x.name === city);
      if (c && MapAPI.ready()) MapAPI.highlight(city);
      // 高亮胶片格
      row.querySelectorAll('.fs-cell').forEach(x => x.classList.remove('active'));
      cell.classList.add('active');
      flyAndOpen(city);
    });
  });
  startFilmRotate();
  filmDepthTilt();
}

// 胶片条 3D 景深: 滚到左右边缘的格子向后倾斜(像转动的胶片轮)
// 只用一次 rAF 循环做节流, 静止时不跑
let filmTiltRaf = null;
function filmDepthTilt() {
  const row = document.getElementById('fs-row');
  if (!row) return;
  const update = () => {
    filmTiltRaf = null;
    if (document.hidden) return;
    const rr = row.getBoundingClientRect();
    if (!rr.width) return;
    const cx = rr.left + rr.width / 2;
    row.querySelectorAll('.fs-cell').forEach(el => {
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2;
      // -1(最左) ~ +1(最右); 越靠边越后仰
      const t = Math.max(-1, Math.min(1, (ex - cx) / (rr.width / 2)));
      // 只写变量, 不碰 transform —— :hover 才能叠加
      el.style.setProperty('--dz', (-Math.abs(t) * 26).toFixed(1) + 'px');
      el.style.setProperty('--dy', (t * 12).toFixed(1) + 'deg');
      el.style.setProperty('--db', (1 - Math.abs(t) * 0.25).toFixed(3));
    });
  };
  const schedule = () => { if (!filmTiltRaf) filmTiltRaf = requestAnimationFrame(update); };
  row.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  schedule();
}

// 胶片封面轮动: 每次随机换几格(老板 2026-09-15 晚拍的), 后台标签页不跑
let fsRotateTimer = null;
const FS_ROTATE_MS = 3500;      // 轮动间隔
const FS_ROTATE_PER_TICK = 4;   // 每次换几格
function startFilmRotate() {
  if (fsRotateTimer) clearInterval(fsRotateTimer);
  fsRotateTimer = setInterval(() => {
    if (document.hidden) return;
    const cells = [...document.querySelectorAll('.fs-cell')]
      .filter(c => photoPool(c.dataset.city).length > 1);
    if (!cells.length) return;
    // 随机挑几格, 换成该城市的另一张照片
    for (let i = 0; i < Math.min(FS_ROTATE_PER_TICK, cells.length); i++) {
      const cell = cells.splice(Math.floor(Math.random() * cells.length), 1)[0];
      const img = cell.querySelector('img');
      const cur = img.getAttribute('src');
      const next = randomPhotoCover(cell.dataset.city, cur);
      if (next === cur) continue;
      img.style.opacity = '0';
      setTimeout(() => { img.src = next; img.style.opacity = '1'; }, 230);
    }
  }, FS_ROTATE_MS);
}

// 缩放分级展开(老板 09-16 拍板: 先出展示版, 照片不能糊成一团)
// 远景只显照片最多的 8 个; 拉近逐级展开到全部。每个地点在 3D 场景里始终有发光点。
function applyZoomFold() {
  const zoom = MapAPI.getZoom();
  mapZoomLevel = zoom;
  const narrow = document.getElementById('map-wrap').clientWidth < 560;
  const is3d = MAP_BACKEND === 'three';
  // 手机屏窄, 照片再小一档, 才排得开
  const narrowK = document.getElementById('map-wrap').clientWidth < 560 ? 0.78 : 1;
  const s3d = is3d ? Math.max(0.5, Math.min(1.2, 1.45 / Math.max(1, zoom))) * narrowK : 1;
  // 展开档位: zoom 越大显越多(放宽过, 避免手机上只露十来个)
  let quota = Infinity;
  if (is3d) {
    if (zoom < 1.6)       quota = 20;
    else if (zoom < 2.4)  quota = 30;
    else                  quota = Infinity;
  } else if (narrow) {
    quota = 14;                 // 纯 2D 窄屏沿用旧行为
  }
  // 按照片数排序定"谁能上"; 家(home)永远优先
  const ranked = CITIES.filter(c => photoCount(c.name) > 0 && !c.home)
    .sort((a, b) => photoCount(b.name) - photoCount(a.name));
  const allowed = new Set(ranked.slice(0, Math.max(0, quota - 1)).map(c => c.name));
  const homeCity = CITIES.find(c => c.home);
  if (homeCity && photoCount(homeCity.name)) allowed.add(homeCity.name);   // ★ 家必显

  document.querySelectorAll('.map-pin').forEach(pin => {
    pin.style.display = allowed.has(pin.dataset.city) ? '' : 'none';
    pin.classList.toggle('zoom-big', zoom > 2.5);
  });

  // 3D: 屏幕位置太近的城市只留一张照片(其余仍有发光点, hover 记忆卡可看)
  // 这些城市地理上就重合(西庄子/宝鸡/太白山同在陕西), 不聚类会永远糊在一起
  if (is3d) {
    // 手机上地图窄, 城市投影间距小, 阈值同比收窄; 但保底要够 ——
    // 原来是 16px, 375 屏上照片(约 37px 宽)会互相压住糊成一团(2026-09-21 实测)
    const wrapW = document.getElementById('map-wrap').clientWidth;
    const minGap = Math.max(wrapW < 560 ? 30 : 22, wrapW / 673 * 30);
    // 照片多的优先; 家最高优先(不能被别人挤掉)
    const cands = [];
    document.querySelectorAll('.map-pin').forEach(pin => {
      if (pin.style.display === 'none') return;
      const c = CITIES.find(x => x.name === pin.dataset.city);
      if (!c) return;
      const p = MapAPI.project(c.coord);
      if (!p) return;
      cands.push({ pin, p, n: photoCount(c.name), home: !!c.home });
    });
    cands.sort((a, b) => (b.home - a.home) || (b.n - a.n));
    const kept = [];
    for (const cd of cands) {
      const clash = kept.some(k => Math.hypot(k[0] - cd.p[0], k[1] - cd.p[1]) < minGap);
      // 家即使撞车也保留(它是视觉锚点)
      if (clash && !cd.home) cd.pin.style.display = 'none';
      else kept.push(cd.p);
    }
    // 变量写在 overlay 上, 所有 .map-pin 继承
    document.getElementById('map-overlay').style.setProperty('--pin-scale', s3d);
  }
}

let mapCardEl = null;
function showMapCard(pin, c, imgs, since, note) {
  hideMapCard();
  mapCardEl = document.createElement('div');
  mapCardEl.className = 'map-card';
  // 记忆卡缩略图也只取照片, 视频不进(老板 2026-09-15 晚)
  const thumbs = photoPool(c.name).slice(0, 3)
    .map(s => `<img src="${thumbOf(s)}" alt="" loading="lazy">`).join('');
  const sinceHtml = since ? `<div class="mc-since">🕐 ${since}</div>` : '';
  const noteHtml = note ? `<div class="mc-note">${note}</div>` : '';
  const more = imgs.length > 3 ? `<div class="mc-count">+${imgs.length - 3} 张 · 点击看全部</div>` : '';
  mapCardEl.innerHTML = `
    <div class="mc-city">${c.name}${c.home ? ' 🏠' : ''}</div>
    ${sinceHtml}${noteHtml}
    <div class="mc-imgs">${thumbs}</div>${more}`;
  document.getElementById('map-overlay').appendChild(mapCardEl);
  const pinRect = pin.getBoundingClientRect();
  const wrapRect = document.getElementById('map-wrap').getBoundingClientRect();
  let left = pinRect.left - wrapRect.left + 36;
  let top = pinRect.top - wrapRect.top - 10;
  if (left + 240 > wrapRect.width) left -= 240;
  if (top < 4) top = pinRect.top - wrapRect.top + 40;
  mapCardEl.style.left = left + 'px';
  mapCardEl.style.top = top + 'px';
  requestAnimationFrame(() => mapCardEl.classList.add('show'));
}
function hideMapCard() {
  if (mapCardEl) { mapCardEl.remove(); mapCardEl = null; }
}

// 地图缩放/平移后重定位浮层(防抖, 缩放拖拽高频触发)
let overlayReposTimer = null;
function repositionOverlay() {
  if (overlayReposTimer) clearTimeout(overlayReposTimer);
  overlayReposTimer = setTimeout(() => {
    // 拖拽越界拉回: 中心点跑太远就把地图拉回可见范围(防纯空白)
    const c = MapAPI.getCenter();
    if (c && (Math.abs(c[0] - 110) > 35 || Math.abs(c[1] - 36) > 30)) {
      MapAPI.setCenter([
        Math.max(75, Math.min(145, c[0])),
        Math.max(6, Math.min(66, c[1]))

    layoutPins();
    applyZoomFold();
    hideMapCard();
  }, 80);
}

// ── ① 成就系统 ──
function computeAchievements() {
  const items = [];
  const add = (icon, name, desc, earned, city=null) =>
    items.push({icon, name, desc, earned, city});

  // 极值勋章
  const pts = CITIES.filter(c => !c.home);
  const north = pts.reduce((a,b) => b.coord[1] > a.coord[1] ? b : a);
  const south = pts.reduce((a,b) => b.coord[1] < a.coord[1] ? b : a);
  const east  = pts.reduce((a,b) => b.coord[0] > a.coord[0] ? b : a);
  const west  = pts.reduce((a,b) => b.coord[0] < a.coord[0] ? b : a);

  add('🧭','最北足迹', `到达最北点 · ${north.name}（北纬 ${north.coord[1].toFixed(1)}°）`, true, north.name);
  add('🧭','最南足迹', `到达最南点 · ${south.name}（北纬 ${south.coord[1].toFixed(1)}°）`, true, south.name);
  add('🧭','最东足迹', `到达最东点 · ${east.name}（东经 ${east.coord[0].toFixed(1)}°）`, true, east.name);
  add('🧭','最西足迹', `到达最西点 · ${west.name}（东经 ${west.coord[0].toFixed(1)}°）`, true, west.name);

  // 自然景观
  const tagDefs = {
    sea: ['🌊','看过大海', '踩过沙滩，吹过海风'],
    grassland: ['🌿','草原骑士', '在草原上撒过野'],
    river: ['🌊','黄河少年', '亲眼见过壶口瀑布的黄河'],
    ski: ['⛷️','雪场飞驰', '上过滑雪场'],
  };
  for (const [tag, [ico, name, desc]] of Object.entries(tagDefs)) {
    const hit = CITIES.find(c => (c.tags||[]).includes(tag) && !c.home);
    add(ico, name, desc, !!hit, hit ? hit.name : null);
  }

  // 山岳系列（独立勋章，爬过几座给几枚）
  const mountains = CITIES.filter(c => (c.tags||[]).includes('mountain'));
  const mountainDefs = {
    '庐山': ['⛰️','庐山登顶', '江西庐山'],
    '宝鸡': ['🏔️','太白山少年', '秦岭主峰太白山（宝鸡眉县）'],
  };
  for (const m of mountains) {
    const def = mountainDefs[m.name];
    if (def) add(def[0], def[1], def[2], true, m.name);
  }

  // 数量勋章
  add('🥉','十城达成', '足迹达到 10 个地点', CITIES.length >= 10);
  add('🥈','二十城达成', '足迹达到 20 个地点', CITIES.length >= 20);
  add('🥇','三十城达成', '足迹达到 30 个地点', CITIES.length >= 30);
  add('💯','四十城冲刺', '足迹达到 40 个地点', CITIES.length >= 40);

  // 省份
  const provCount = new Set(CITIES.map(c => c.prov)).size;
  add('🗺️','行遍十省', `足迹遍布 10 个省级区域（当前 ${provCount}）`, provCount >= 10);
  add('🚩','四大直辖市', '北京天津打卡，其他直辖市待解锁', CITIES.filter(c => ['北京','天津','上海','重庆'].includes(c.name)).length >= 4);

  return items;
}

// ── ② 每城一句话 ──
// 整城视角的描述(城市墙/记忆卡): 用老板手写, 没有则 AI 城市描述
function noteFor(city) {
  const note = noteOf(city);
  if (!note) return '';
  // AI 补位的标注出来, 老板手写的不标注
  const ai = noteSrcOf(city) === 'ai' ? '<span class="ai-mark" title="AI 根据照片自动生成">AI</span>' : '';
  return `💬 ${ai}${note}`;
}

// 逐张视角(剧场/灯箱): 首媒体用老板手写, 其余用该张 AI 描述
// 返回 HTML(带 AI 标记), 供 innerHTML 用
function mediaNoteHtml(city, mediaPath) {
  const r = descFor(city, mediaPath);
  if (!r.text) return '';
  const ai = r.src === 'ai' ? '<span class="ai-mark" title="AI 根据照片自动生成">AI</span>' : '';
  return `💬 ${ai}${escapeHtml(r.text)}`;
}
// 纯文本版, 供 textContent 用
function mediaNoteText(city, mediaPath) {
  return descFor(city, mediaPath).text;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}

// ── ③ 剧场引擎 · 照片轮播(旅程重放/随机旅程共用) ──
const THEATER_PER_PHOTO = 2500;  // 每张照片停留 ms
let theaterTimer = null, theaterProgressTimer = null;
let theaterQueue = [];           // [{city, imgs:[...]}] 播放队列
let theaterIdx = 0;              // 队列位置
let theaterPhotoIdx = 0;         // 当前城市照片位置
let theaterPaused = false;       // 暂停状态

function theaterCitiesWithPhotos() {
  return CITIES.filter(c => photoCount(c.name) > 0);
}

function startTheater(queue) {
  theaterQueue = queue;
  theaterIdx = 0;
  theaterPhotoIdx = 0;
  theaterPaused = false;
  thCurLayer = 'b';  // 让第一张落在 a 层正常淡入
  ['a','b'].forEach(k => {
    const slot = document.getElementById('th-slot-' + k);
    slot.classList.remove('fade-out','fade-in');
    slot.innerHTML = '';
  });
  document.getElementById('theater').classList.add('open');
  document.getElementById('th-pause').textContent = '⏸';
  playTheaterStep();
}

// 暂停/继续
function toggleTheaterPause() {
  if (!document.getElementById('theater').classList.contains('open')) return;
  theaterPaused = !theaterPaused;
  const btn = document.getElementById('th-pause');
  if (theaterPaused) {
    btn.textContent = '▶';
    if (theaterTimer) { clearTimeout(theaterTimer); theaterTimer = null; }
  } else {
    btn.textContent = '⏸';
    playTheaterStep();
  }
}

// 双层交叉淡入: 当前显层 A 或 B
let thCurLayer = 'a';
let videoStepMs = 2500;  // 当前媒体步长(视频 8s, 照片 2.5s)
let thSwapToken = 0;     // 原图替换令牌: 切图后作废旧回调

// 预取后续"缩略图"(单张 ~18KB, 便宜), 让下一张轮到时不空窗。
// 不预取原图 —— 单张 406KB, 慢网要 10 秒以上, 抢走的带宽反而拖垮缩略图, 且永远追不上 2.5 秒的节奏。
const thPrefetched = new Set();
function prefetchThumbs(item, fromIdx, count) {
  for (let i = fromIdx; i < Math.min(item.imgs.length, fromIdx + count); i++) {
    const p = item.imgs[i];
    if (isVideo(p) || thPrefetched.has(p)) continue;
    thPrefetched.add(p);
    const im = new Image();
    im.src = thumbOf(p);
  }
}

function playTheaterStep() {
  if (theaterIdx >= theaterQueue.length) { stopTheater(); return; }
  const item = theaterQueue[theaterIdx];
  const c = item.city;
  const imgs = item.imgs;
  prefetchThumbs(item, theaterPhotoIdx + 1, 3);
  // 同步地图高亮(只脉冲, 不运镜 —— 否则剧场每 2.5 秒飞一次镜头)
  if (MapAPI.ready()) MapAPI.highlight(c.name);
  document.getElementById('th-city').textContent = c.name;
  // 描述: 该城首媒体显示老板手写, 其余显示该张 AI 描述(2026-09-21 老板定)
  // 没有描述时隐藏药丸, 不留空白框
  const noteEl = document.getElementById('th-note');
  const noteHtml = mediaNoteHtml(c.name, imgs[theaterPhotoIdx]);
  noteEl.innerHTML = noteHtml;
  noteEl.style.display = noteHtml ? '' : 'none';

  // 交叉淡入: 在非当前槽放新媒体 fade-in, 当前槽 fade-out
  const cur = document.getElementById('th-slot-' + thCurLayer);
  const nxt = document.getElementById('th-slot-' + (thCurLayer === 'a' ? 'b' : 'a'));
  const mediaPath = imgs[theaterPhotoIdx];
  const styleAttr = 'border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.8);display:block';
  if (isVideo(mediaPath)) {
    // 视频流式播放, 缓冲出首帧即显示(没有视频封面图, 用了会 404)
    nxt.innerHTML = `<video src="${mediaPath}" autoplay muted loop playsinline style="${styleAttr}"></video>`;
    // 视频时长未知, 固定给 8s 展示时间(足够看一段); 视频按 16:9 预留框
    videoStepMs = 8000;
    fitTheaterFrame(16 / 9);
  } else {
    // 缩略图秒显(2026-09-20): 原图平均 406KB、慢网单张要 ~10 秒, 而每张只停留 2.5 秒,
    // 直接上原图必然追不上, 画面全空。先用 300px 缩略图保证"永远有画面"。
    const thumb = thumbOf(mediaPath);
    nxt.innerHTML = `<img src="${thumb}" alt="" style="${styleAttr}">`;
    videoStepMs = THEATER_PER_PHOTO;
    // 图片按真实比例预留框, 避免不同比例切换时画面跳位(老板 2026-09-15 晚)
    const im = nxt.querySelector('img');
    const fit = () => { if (im.naturalWidth) fitTheaterFrame(im.naturalWidth / im.naturalHeight); };
    if (im.complete) fit();
    else im.onload = fit;
    // 原图仅"快网"才换: 用缩略图本身的耗时当探针 —— 缩略图 1 秒内下完说明链路够快,
    // 值得再拉 406KB 的原图; 否则跳过, 不跟缩略图抢本就稀缺的带宽。
    const token = ++thSwapToken;
    const thumbT0 = Date.now();
    const maybeHiRes = () => {
      if (token !== thSwapToken) return;
      if (Date.now() - thumbT0 > 1000) return;   // 链路慢, 保持缩略图
      const hi = new Image();
      hi.onload = () => {
        if (token !== thSwapToken) return;
        if (!im.parentElement) return;
        if (im.getAttribute('src') !== thumb) return;
        im.src = mediaPath;
      };
      hi.src = mediaPath;
    };
    if (im.complete) maybeHiRes(); else im.addEventListener('load', maybeHiRes, { once: true });
  }
  // 清理旧槽的视频/图(等淡入结束再清, 不影响 frame 尺寸)
  const oldCur = cur;
  setTimeout(() => { oldCur.innerHTML = ''; }, 950);
  cur.classList.remove('fade-in');
  cur.classList.add('fade-out');
  nxt.classList.remove('fade-out');
  nxt.classList.add('fade-in');
  thCurLayer = thCurLayer === 'a' ? 'b' : 'a';

  // 周边动态: 每次切图随机组合效果(光晕/流光弧/星尘), 避免一直一个样
  randomizeEffects();

  // 进度条
  const bar = document.getElementById('th-bar');
  bar.style.width = '0%';
  bar.style.transition = 'none';
  void bar.offsetWidth;
  bar.style.transition = `width ${videoStepMs}ms linear`;
  bar.style.width = '100%';

  theaterPhotoIdx++;
  if (theaterPhotoIdx >= imgs.length) {
    theaterPhotoIdx = 0;
    theaterIdx++;
  }
  if (theaterTimer) clearTimeout(theaterTimer);
  theaterTimer = setTimeout(playTheaterStep, videoStepMs);
}

// 剧场框按图片比例自适应(老板 2026-09-15 晚: 修"图片突然偏离中心")
// 竖图留竖框、横图留横框, 两槽共用同一尺寸 → 交叉淡入全程同心
function fitTheaterFrame(ratio) {
  if (!ratio || !isFinite(ratio)) ratio = 4 / 3;
  const MAX_W = window.innerWidth * 0.78;
  const MAX_H = window.innerHeight * 0.58;
  // 按比例先撑满宽, 再按高度回缩; 结果框内只留这一张图, 不塌不跳
  let w = MAX_W, h = w / ratio;
  if (h > MAX_H) { h = MAX_H; w = h * ratio; }
  const frame = document.querySelector('.th-frame');
  frame.style.width = Math.round(w) + 'px';
  frame.style.height = Math.round(h) + 'px';
}

// 周边动态随机引擎: 每张照片随机组合光晕/流光弧/星尘
const SPARK_COLORS = ['#ffd166','#ff5d8f','#7bf1a8','#4fd1ff','#c084fc','#ff9e5e'];
let lastEffectSet = -1;

function randomizeEffects() {
  const glow = document.querySelector('.th-glow');
  const arcs = document.querySelectorAll('.th-arc');
  // 3 种效果随机开/关(至少保留 1-2 种)
  let set;
  do {
    set = Math.floor(Math.random() * 8); // 000~111 位掩码: glow|arc|spark
  } while (set === lastEffectSet);
  lastEffectSet = set;

  const glowOn = (set & 1) === 1;
  const arcOn = (set & 2) === 2;
  const sparkOn = (set & 4) === 4;

  glow.classList.toggle('off', !glowOn);
  arcs.forEach(a => a.classList.toggle('off', !arcOn));
  const sparkle = document.getElementById('th-sparkle');
  if (sparkOn) {
    refreshSparkles();
    sparkle.style.display = '';
  } else {
    sparkle.style.display = 'none';
  }
}

// 星尘: 8 颗彩点环绕照片漂浮
function refreshSparkles() {
  const box = document.getElementById('th-sparkle');
  box.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'th-spark';
    const angle = (i / 8) * Math.PI * 2;
    const dist = 30 + Math.random() * 26;
    s.style.left = (50 + Math.cos(angle) * dist) + '%';
    s.style.top = (50 + Math.sin(angle) * dist * 0.6) + '%';
    s.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    s.style.boxShadow = `0 0 8px 2px ${SPARK_COLORS[i % SPARK_COLORS.length]}88`;
    s.style.animationDelay = (Math.random() * 1.4) + 's';
    s.style.animationDuration = (2 + Math.random() * 1.4) + 's';
    box.appendChild(s);
  }
}

function stopTheater() {
  if (theaterTimer) { clearTimeout(theaterTimer); theaterTimer = null; }
  theaterPaused = false;
  document.getElementById('theater').classList.remove('open');
  replayOn = false;
  const btn = document.getElementById('replay-btn');
  if (btn) { btn.textContent = '▶️ 旅程重放'; btn.classList.remove('on'); }
  document.querySelectorAll('.map-pin').forEach(resetReplayPin);
  applyZoomFold();
}

// 随机旅程: 随机抽一个有照片的城市, 剧场轮播
function randomJourney() {
  const candidates = theaterCitiesWithPhotos();
  if (!candidates.length) { alert('还没有照片哦，先传一些照片吧'); return; }
  const c = candidates[Math.floor(Math.random() * candidates.length)];
  startTheater([{ city: c, imgs: photoImgs(c.name) }]);
}

// ── ▶️ 旅程重放: 随机顺序 · 剧场照片轮播 ──
let replayOn = false;

// 复位视角: 回到"推近到足迹密集区"的初始机位
document.getElementById('reset-view-btn').addEventListener('click', () => {
  if (ThreeBackend.resetView) ThreeBackend.resetView();
});

document.getElementById('replay-btn').addEventListener('click', () => {
  if (replayOn) { stopTheater(); return; }
  const candidates = theaterCitiesWithPhotos();
  if (!candidates.length) { alert('还没有照片哦，先传一些照片吧'); return; }
  // 随机打乱城市顺序
  const shuffled = [...candidates].sort(() => Math.random() - 0.5);
  replayOn = true;
  const btn = document.getElementById('replay-btn');
  btn.textContent = '⏸ 停止重放';
