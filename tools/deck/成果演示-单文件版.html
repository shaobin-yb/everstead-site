<script type="text/plain" id="bridge-source">/* Runs before each original page, in its own iframe realm. */
(() => {
  const host = parent.presentation;
  const index = Number(window.frameElement.dataset.page);
  const nativeRAF = requestAnimationFrame.bind(window);
  const nativeCancel = cancelAnimationFrame.bind(window);
  const pending = new Map();
  let suspended = false, serial = 0;
  function schedule(id, task) {
    task.native = nativeRAF(t => {
      if (suspended) return;
      pending.delete(id);
      task.callback(t);
    });
  }
  window.requestAnimationFrame = callback => {
    const id = ++serial, task = { callback, native: null };
    pending.set(id, task);
    if (!suspended) schedule(id, task);
    return id;
  };
  window.cancelAnimationFrame = id => {
    const task = pending.get(id);
    if (task) { nativeCancel(task.native); pending.delete(id); }
  };
  const pausedAnimations = new Set();
  const pausedMedia = new Set();
  window.__presentationBridge = {
    pause() {
      if (suspended) return;
      suspended = true;
      for (const task of pending.values()) nativeCancel(task.native);
      for (const animation of document.getAnimations()) {
        if (animation.playState === 'running') { pausedAnimations.add(animation); animation.pause(); }
      }
      for (const media of document.querySelectorAll('video,audio')) {
        if (!media.paused) { pausedMedia.add(media); media.pause(); }
      }
    },
    resume() {
      if (!suspended) return;
      suspended = false;
      for (const [id, task] of pending) schedule(id, task);
      for (const animation of pausedAnimations) { try { animation.play(); } catch {} }
      pausedAnimations.clear();
      for (const media of pausedMedia) media.play().catch(() => {});
      pausedMedia.clear();
    },
    get suspended() { return suspended; },
    get pendingFrames() { return pending.size; }
  };
  const bound = new WeakSet();
  function attach(win, nested = false) {
    try {
      if (bound.has(win.document)) return;
      bound.add(win.document);
      const mode = () => nested && win.frameElement && win.getComputedStyle(win.frameElement).pointerEvents==='none' ? 'presentation' : nested;
      win.addEventListener('keydown', e => host.key(e, index, mode()), true);
      win.addEventListener('wheel', e => host.wheel(e, index, mode()), {capture:true, passive:false});

        for (const frame of win.document.querySelectorAll('iframe')) {
          if (!frame.dataset.presentationBound) {
            frame.dataset.presentationBound = '1';
            frame.addEventListener('load', () => attach(frame.contentWindow, true));
          }
          attach(frame.contentWindow, true);
        }
      }
      new win.MutationObserver(frames).observe(win.document, {childList:true, subtree:true});
      frames();

/* 纯 JS SHA-256 —— 与 everstead-site 的口令门同一实现，源码只存哈希不存明文 */
function sha256(ascii){function rightRotate(value,amount){return(value>>>amount)|(value<<(32-amount))}
var mathPow=Math.pow,maxWord=mathPow(2,32),result='',words=[],asciiBitLength=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length,isComposite={};
for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(var i=0;i<313;i+=candidate)isComposite[i]=candidate;hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0}}
ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(var i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=(asciiBitLength);
for(var j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);
for(var i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
