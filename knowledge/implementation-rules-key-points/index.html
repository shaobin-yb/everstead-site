const PAGES = ["../pages/implementation-rules-key-points/p001.jpg", "../pages/implementation-rules-key-points/p002.jpg", "../pages/implementation-rules-key-points/p003.jpg", "../pages/implementation-rules-key-points/p004.jpg", "../pages/implementation-rules-key-points/p005.jpg", "../pages/implementation-rules-key-points/p006.jpg", "../pages/implementation-rules-key-points/p007.jpg", "../pages/implementation-rules-key-points/p008.jpg", "../pages/implementation-rules-key-points/p009.jpg", "../pages/implementation-rules-key-points/p010.jpg", "../pages/implementation-rules-key-points/p011.jpg", "../pages/implementation-rules-key-points/p012.jpg", "../pages/implementation-rules-key-points/p013.jpg"];
let i = 0;
const img = document.getElementById('pg');
const ind = document.getElementById('ind');
const prevB = document.getElementById('prev');
const nextB = document.getElementById('next');
function go(n){
  if(n < 0 || n >= PAGES.length) return;
  i = n;
  img.src = PAGES[i];
  ind.textContent = (i+1) + ' / ' + PAGES.length;
  prevB.classList.toggle('off', i === 0);
  nextB.classList.toggle('off', i === PAGES.length-1);
  if(i+1 < PAGES.length){ new Image().src = PAGES[i+1]; }
  if(i-1 >= 0){ new Image().src = PAGES[i-1]; }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ go(i+1); }
  if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ go(i-1); }
});
let tx = null;
document.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', function(e){
  if(tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 50){ go(i + (dx < 0 ? 1 : -1)); }
}, {passive: true});
</script>
