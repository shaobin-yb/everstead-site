  document.querySelectorAll('.map-pin').forEach(p => { p.style.display = ''; });
  startTheater(shuffled.map(c => ({ city: c, imgs: photoImgs(c.name) })));
});

function resetReplayPin(pin) {
  if (!pin) return;
  pin.style.transform = 'translate(-50%,-50%) scale(1)';
  // 恢复第一张
  const alt = pin.querySelector('img').alt;
  const cover = photoCover(alt);
  if (cover) pin.querySelector('.pin-photo').src = cover;
}

// ── 🎵 背景音乐: 随机播放, 点击切换(默认关, 浏览器自动播放策略) ──
let musicList = [], musicIdx = -1;
// ★ musicIntent = 用户意图, 同步置位, 是唯一真相。
//   旧版把 musicPlaying 放在 play() 的异步回调里设置, 连点两下就错位 →
//   "按了暂停停不掉"(老板 2026-09-16 反馈)。这里彻底改成同步状态。
let musicIntent = false;
const musicAudio = new Audio();

function loadMusicList() {
  // music.json 由铁蛋扫描 music/ 目录生成; 没有就静默
  return fetch('music.json?t=' + Date.now())
    .then(r => r.json())
    .then(m => { musicList = m.files || []; })
    .catch(() => { musicList = []; });
}

function updateMusicUI(playing) {
  const btn = document.getElementById('music-btn');
  if (!btn) return;
  if (playing && musicList[musicIdx]) {
    // 曲名显示(去掉扩展名)
    const fname = musicList[musicIdx].split('/').pop().replace(/\.[^.]+$/, '');
    btn.innerHTML = `<div class="num">🎵</div><div class="label">${fname.slice(0, 14)}</div>`;
    btn.classList.add('playing');
  } else {
    btn.innerHTML = `<div class="num">🎵</div><div class="label">音乐</div>`;
    btn.classList.remove('playing');
  }
}

function playNextMusic() {
  if (!musicList.length) return;
  musicIntent = true;                       // 同步置位, 不留竞态窗口
  musicIdx = (musicIdx + 1) % musicList.length;
  musicAudio.src = musicList[musicIdx];
  musicAudio.volume = 0.8;  // 更清楚(老板反馈听不到, 0.6→0.8)
  updateMusicUI(true);
  musicAudio.play().catch(err => {
    console.log('[music] 播放被拦, 等用户手势', err.name);
    if (musicIntent) { musicIntent = false; updateMusicUI(false); }
  });
}

// 彻底停止: 除 pause 外还清空 src, 防止待决的 play() 把声音又拉起来
function stopMusic() {
  musicIntent = false;
  try {
    musicAudio.pause();
    musicAudio.removeAttribute('src');
    musicAudio.load();
  } catch (e) {}
  updateMusicUI(false);
}

// (浮层方案已废弃 2026-09-15: 老板反馈弹窗体验差, 改回滑动/点击即播)
function toggleMusic() {
  musicAutoArmed = true;  // 手动点过音乐按钮 = 用户已交互
  // 意图或实际声音任一为"开"就停 —— 双保险, 不会出现停不掉的情况
  if (musicIntent || !musicAudio.paused) stopMusic();
  else playNextMusic();
}
musicAudio.addEventListener('ended', () => { if (musicIntent) playNextMusic(); });

// 自动播放: 滑动/点击即播(老板 2026-09-15 拍板, 不要弹窗)
let musicAutoArmed = false;
function armAutoMusic(e) {
  // 音乐按钮上的点击交给 toggleMusic 处理, 避免 pointerdown 开播后 click 又关掉
  if (e && e.target && document.getElementById('music-btn').contains(e.target)) return;
  if (musicAutoArmed || musicIntent) return;
  musicAutoArmed = true;
  playNextMusic();
}
// 注意: 滑动手势可能触发 pointerdown, 统一交给 pointerdown; wheel 做兜底
document.addEventListener('pointerdown', armAutoMusic, { passive: true });
document.addEventListener('wheel', armAutoMusic, { passive: true });
document.addEventListener('touchstart', armAutoMusic, { passive: true });
document.addEventListener('keydown', armAutoMusic, { passive: true });

// ═══ 3D 旋转照片环(老板 2026-09-15 晚创意) ═══
// 常驻窗口: 全部有照片的地点沿圆柱排布, 缓慢自转 + 可拖拽, 点击进灯箱
const S3D_SPEED = 0.06;        // 自转角速度(度/帧), 慢速常转
let s3dAngle = 0, s3dRaf = null, s3dDrag = null, s3dVX = 0;
let s3dLastT = 0;

// 窄屏把胶片条挪到旋转环下面(老板 2026-09-21): 手机上地图占满一屏宽,
// 胶片竖挤在右侧既窄又难滑; 放到环形下方通栏横排更好用。桌面保持右侧竖排。
function layoutForViewport() {
  const strip = document.getElementById('film-strip');
  const stage = document.getElementById('stage3d');
  const mapRow = document.querySelector('.map-row');
  if (!strip || !stage || !mapRow) return;
  const narrow = window.innerWidth <= 939;
  const inRow = strip.parentElement === mapRow;
  if (narrow && inRow) {
    stage.insertAdjacentElement('afterend', strip);   // 环形之后
  } else if (!narrow && !inRow) {
    mapRow.appendChild(strip);                        // 回到地图右侧
  }
}

function buildStage3d() {
  const ring = document.getElementById('s3d-ring');
  const stage = document.getElementById('stage3d');
  if (!ring || !stage) return;
  layoutForViewport();
  let cities = CITIES.filter(c => photoCount(c.name) > 0);
  if (!cities.length) { stage.style.display = 'none'; return; }
  stage.style.display = '';

  // 手机端: 条窄而矮, 卡片少一些、间距拉开 —— 18 张时环上太密,
  // 大部分卡片处于大角度被透视压成竖条, 看着就是一段黑条(老板 2026-09-21 反馈)
  const narrowStage = stage.clientWidth < 560;
  const MAX_CARDS = narrowStage ? 12 : 18;
  if (cities.length > MAX_CARDS) {
    cities = [...cities].sort((a, b) => photoCount(b.name) - photoCount(a.name)).slice(0, MAX_CARDS);
  }


  // 双层环: 卡片分上下两圈(各占一半)
  // 尺寸按"地图下方的附属条"定 —— 小一号, 不喧宾夺主(老板 09-16)
  // 卡片宽: 由条高反推(上下两圈 + 卡高要塞得下)
  const stageW = Math.max(300, stage.clientWidth);
  const stageH = Math.max(90, stage.clientHeight);
  const TILT = 7 * Math.PI / 180;     // 与 CSS .s3d-scene 的 rotateX 一致
  const PERSP = 1500;                 // 与 CSS .stage3d 的 perspective 一致
  // 卡片宽度: 手机条矮(150px), 原系数 0.21 算出 31px 太小、名字看不清。
  // 双圈各占一半高度, 卡片高度不超过半条高即可 —— 用 0.30 系数 + 抬高下限。
  const cw = Math.round(Math.min(58, Math.max(38, stageH * 0.30)));
  const ch = Math.round(cw * 1.33);
  const nameSize = cw < 44 ? 9 : (cw < 54 ? 10 : 11);
  const RING_Y = Math.round(ch * 0.5);
  // 半径: 迭代求解, 保证"最前排卡片"(透视放大 + 倾斜位移后)不越界
  let R = stageW / 2 * 0.72;
  for (let i = 0; i < 8; i++) {
    const m = PERSP / Math.max(1, PERSP - R);                     // 前排放大率
    const need = (RING_Y + R * Math.sin(TILT) + ch / 2) * m;      // 竖向占位
    if (need > stageH * 0.46) R *= 0.88; else break;
  }
  // 弧长要够放卡片(太密就退回小半径); 卡片少时让半径尽量大 ——
  // 半径越大, 卡片与视线的夹角越小, 越多卡片以正面示人(手机端尤其明显)
  const perRing = Math.ceil(cities.length / 2);
  const rArc = (perRing * cw * 1.25) / (2 * Math.PI);
  // 上限放宽到 0.92: 原来 0.85 会把半径压小, 手机端卡片全挤在大角度上
  R = Math.round(Math.max(78, Math.min(R, Math.max(rArc, R * 0.92))));
  ring.innerHTML = '';
  cities.forEach((c, i) => {
    const ringIdx = i < perRing ? 0 : 1;              // 0=上圈, 1=下圈
    const posInRing = ringIdx === 0 ? i : i - perRing;
    const countInRing = ringIdx === 0 ? perRing : cities.length - perRing;
    // 下圈错开半个身位, 让上下卡不叠在一条竖线上
    const offset = ringIdx === 1 ? Math.PI / countInRing : 0;
    const a = (posInRing / countInRing) * Math.PI * 2 + offset;
    const yLift = (ringIdx === 0 ? -RING_Y : RING_Y)
                + (ringIdx === 0 ? -Math.min(14, photoCount(c.name) * 0.4) : 0);

    const card = document.createElement('div');
    card.className = 's3d-card' + (c.home ? ' is-home' : '')
                   + (ringIdx === 1 ? ' ring-lower' : ' ring-upper');
    card.dataset.city = c.name;
    card.innerHTML = `
      <img src="${photoCover(c.name)}" alt="${c.name}" loading="lazy">
      <div class="c3d-name" style="font-size:${nameSize}px">${c.home ? '🏠 ' : ''}${c.name}</div>`;
    // 卡片尺寸 + 居中偏移(负一半宽高)
    card.style.width = cw + 'px';
    card.style.height = ch + 'px';
    card.style.margin = `${-ch / 2}px 0 0 ${-cw / 2}px`;
    // 环面法线朝外: translateZ(R) 后反向旋转面向观察者
    const deg = (a * 180) / Math.PI;
    card.style.transform =
      `rotateY(${deg}deg) translateZ(${R}px) rotateY(${-deg}deg) translateY(${yLift}px)`;
    card.style.transformStyle = 'preserve-3d';
    card.addEventListener('click', e => {
      if (s3dDrag && s3dDrag.moved) return;   // 拖拽结束的那一下不算点击
      e.stopPropagation();
      openLightbox(c.name);
    });
    ring.appendChild(card);
  });

  // 半径写回场景, 让透视比例稳定
  ring.dataset.radius = R;
}

// 自转 + 惯性 + 拖拽(角度统一管理, 避免 CSS 动画与拖拽互相覆盖)
function s3dStart() {
  const ring = document.getElementById('s3d-ring');
  const stage = document.getElementById('stage3d');
  if (!ring || !stage || !ring.children.length) return;

  const spin = t => {
    const dt = s3dLastT ? Math.min(48, t - s3dLastT) : 16;
    s3dLastT = t;
    if (!s3dDrag) {
      s3dAngle += S3D_SPEED * (dt / 16);
      // 拖拽惯性衰减
      if (Math.abs(s3dVX) > 0.02) {
        s3dAngle += s3dVX * (dt / 16);
        s3dVX *= 0.94;
      }
    }
    ring.style.transform = `rotateY(${s3dAngle}deg)`;
    s3dRaf = requestAnimationFrame(spin);
  };
  if (s3dRaf) cancelAnimationFrame(s3dRaf);
  s3dLastT = 0;
  s3dRaf = requestAnimationFrame(spin);

  // 拖拽旋转
  stage.addEventListener('pointerdown', e => {
    // 卡片上的按下交给 click, 但也要能拖 —— 统一在 stage 层处理
    s3dDrag = {x: e.clientX, lastX: e.clientX, moved: false, id: e.pointerId};
    s3dVX = 0;
    stage.classList.add('grabbing');
    stage.setPointerCapture?.(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!s3dDrag || e.pointerId !== s3dDrag.id) return;
    const dx = e.clientX - s3dDrag.lastX;
    s3dDrag.lastX = e.clientX;
    if (Math.abs(e.clientX - s3dDrag.x) > 4) s3dDrag.moved = true;
    s3dAngle += dx * 0.32;      // 水平拖动 → 绕 Y 轴
    s3dVX = dx * 0.32;          // 记录末速度做惯性
  });
  const endDrag = e => {
    if (!s3dDrag) return;
    s3dDrag = null;
    stage.classList.remove('grabbing');
    // 拖拽结束后短暂屏蔽 click, 防误触打开灯箱
    if (stage._clickGuard) clearTimeout(stage._clickGuard);
    stage._clickGuard = setTimeout(() => {}, 60);
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', endDrag);
  // 滚轮也转(桌面顺手)
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    s3dAngle += e.deltaY * 0.18;
  }, {passive:false});
}

// ── 启动 ──
document.getElementById('achieve-btn').addEventListener('click', showAchievements);
document.getElementById('random-btn').addEventListener('click', randomJourney);
document.getElementById('music-btn').addEventListener('click', toggleMusic);
loadMusicList();

const viewToggle = document.getElementById('view-toggle');
viewToggle.addEventListener('click', () => {
  wallMode = wallMode === 'prov' ? 'timeline' : 'prov';
  viewToggle.textContent = wallMode === 'prov' ? '🕐 按时间线' : '🗺️ 按省份';
  viewToggle.classList.toggle('on', wallMode === 'timeline');
  wallMode === 'prov' ? buildWall() : buildTimeline();
});

// 照片 + 每城一句话并行拉取; 两个都到齐再渲染(否则描述会晚一拍才出现)
// 各自失败都不阻塞页面 —— notes 拿不到就退回 CITIES 内置/本地编辑
const fetchNotes = fetch('notes.json?t=' + Date.now()).then(r => r.json())
  .then(n => { NOTES = (n && n.cities) || {}; })
  .catch(() => { NOTES = {}; });

// 逐张照片的 AI 描述(首媒体之外用): 拿不到就整体回退城市描述, 不影响页面
const fetchPhotoDesc = fetch('photo_desc.json?t=' + Date.now()).then(r => r.json())
  .then(d => { PHOTO_DESC = d || {}; })
  .catch(() => { PHOTO_DESC = {}; });

const fetchPhotos = fetch('photos.json?t=' + Date.now()).then(r => r.json())
  .then(m => {
    // 新版 manifest: {城市: {imgs:[], since:''}}; 兼容旧版数组格式
    for (const [city, v] of Object.entries(m)) {
      if (Array.isArray(v)) m[city] = { imgs: v, since: '' };
    }
    PHOTOS = m;
    // 照片时间兜底写入 CITIES(仅当老板没手工填过)
    const edits = loadEdits();
    for (const c of CITIES) {
      if (!c.since && m[c.name] && m[c.name].since && !(edits[c.name] && edits[c.name].since)) {
        c.since = m[c.name].since.slice(0, 7); // 首访时间取到月
      }
    }
  })
  .catch(() => { PHOTOS = {}; });

Promise.all([fetchNotes, fetchPhotos, fetchPhotoDesc]).finally(() => {
  wallMode === 'prov' ? buildWall() : buildTimeline();
  renderMap();
  buildStage3d();
  s3dStart();
});

// 横竖屏切换 / 改窗口大小时, 重新决定胶片条位置(桌面右侧竖排 ↔ 手机环形下横排)
let _layoutT = null;
window.addEventListener('resize', () => {
  clearTimeout(_layoutT);
  _layoutT = setTimeout(() => { layoutForViewport(); buildStage3d(); }, 200);
});

</script>
