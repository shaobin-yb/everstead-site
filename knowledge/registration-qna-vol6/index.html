<div class="viewer"><img id="pg" src="../pages/registration-qna-vol6/p001.jpg" alt="债权投资计划注册系列问题与解答(第六期)"></div><div class="viewer-nav"><button class="viewer-btn" id="prev" onclick="go(i-1)">‹ 上一页</button><span class="viewer-pg" id="ind">1 / 5</span><button class="viewer-btn" id="next" onclick="go(i+1)">下一页 ›</button></div><script>
const PAGES = ["../pages/registration-qna-vol6/p001.jpg", "../pages/registration-qna-vol6/p002.jpg", "../pages/registration-qna-vol6/p003.jpg", "../pages/registration-qna-vol6/p004.jpg", "../pages/registration-qna-vol6/p005.jpg"];
let i = 0;
const img = document.getElementById('pg');
const ind = document.getElementById('ind');
const prevB = document.getElementById('prev');
const nextB = document.getElementById('next');
function go(n){
  if(n < 0 || n >= PAGES.length) return;
  i = n;
  img.src = PAGES[i];
  ind.textContent = (i+1) + ' / ' + PAGES.length;
  prevB.classList.toggle('off', i === 0);
  nextB.classList.toggle('off', i === PAGES.length-1);
  if(i+1 < PAGES.length){ new Image().src = PAGES[i+1]; }
  if(i-1 >= 0){ new Image().src = PAGES[i-1]; }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ go(i+1); }
  if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ go(i-1); }
});
let tx = null;
document.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', function(e){
  if(tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 50){ go(i + (dx < 0 ? 1 : -1)); }
}, {passive: true});
</script>
