<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小月饼的足迹地图 · 42 地 · M</title>
<!-- 依赖改为非阻塞按需加载(2026-09-20): 此前 echarts(1MB)+three(608KB) 同步阻塞 <head>,
     慢网下页面骨架要等 30 秒以上才出来。echarts 只在 WebGL 不可用退回 2D 时才需要。
     Three.js r149 UMD (锁版本: r160 起官方移除 UMD 构建) -->
<script>
window._dep = {
  three: null,
  echarts: null,
  loadThree() {
    if (!this.three) this.three = this._load('three.min.js');
    return this.three;
  },
  loadEcharts() {
    if (!this.echarts) this.echarts = this._load('echarts.min.js');
    return this.echarts;
  },
  _load(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => res(true);
      s.onerror = () => rej(new Error(src + ' 加载失败'));
      document.head.appendChild(s);
    });
  }
};
</script>
<style>
  /* 地名书法体: 马善政毛笔楷书(Google Fonts 开源, SIL OFL 1.1)
     已子集化 —— 5720KB → 90KB, 只含页面用到的 341 字; 重新生成见 fonts/subset_font.py */
  @font-face {
    font-family: 'MaoBiKai';
    src: url('fonts/mashanzheng-sub.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --ink: 'MaoBiKai', 'KaiTi', 'STKaiti', 'Kaiti SC', serif;   /* 地名书法体 */
    --bg0:#0b0d1a; --bg1:#1a1038; --bg2:#0b0d1a;
    --card: rgba(255,255,255,.05); --border: rgba(255,255,255,.14);
    --text:#f2f4ff; --muted:#aab0d0;
    --pink:#ff5d8f; --orange:#ff9e5e; --gold:#ffd166; --green:#7bf1a8;
    --cyan:#4fd1ff; --blue:#7a8cff; --purple:#c084fc;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 全局交互反馈(老板 09-16: 原则上界面都要有交互) */
  button, .chip, .fs-cell, .s3d-card, .timeline-item, .map-pin, .stat[style*="cursor"],
  .view-toggle, .lb-nav, .th-close, .lb-close, .edit-toggle { cursor: pointer; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(1100px 550px at 85% -8%, rgba(192,132,252,.18), transparent 60%),
      radial-gradient(900px 500px at -5% 12%, rgba(79,209,255,.14), transparent 55%),
      radial-gradient(1000px 600px at 55% 115%, rgba(255,93,143,.13), transparent 60%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 52%, var(--bg2));
    background-attachment: fixed;
    padding: 26px 30px 40px;
    overflow-x: hidden;
  }
  /* 漂浮粒子背景 */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .particle { position: absolute; border-radius: 50%; opacity: .5; animation: floatUp linear infinite; }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: .55; }
    85%  { opacity: .25; }
    100% { transform: translateY(-115vh) scale(1.35); opacity: 0; }
  }
  .wrap { position: relative; z-index: 1; }

  .header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .header h1 {
    font-size: 32px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg,#ff5d8f,#ff9e5e,#ffd166,#7bf1a8,#4fd1ff,#c084fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: hueShift 8s linear infinite;
  }
  @keyframes hueShift { to { filter: hue-rotate(360deg); } }
  .header .sub { color: var(--muted); font-size: 14px; }
  /* 版本徽章: M = 手机端优化版(老板 2026-09-21 要的标识) */
  .header .ver-badge {
    font: 700 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: .5px; padding: 3px 7px; border-radius: 6px;
    color: #7bf1a8; background: rgba(123,241,168,.14);
    border: 1px solid rgba(123,241,168,.4);
    transform: translateY(-4px);
  }

  .stats { display:flex; gap:14px; margin:18px 0 22px; flex-wrap:wrap; }
  .stat {
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    padding: 14px 20px; text-align:center; min-width: 118px;
    backdrop-filter: blur(8px); transition: transform .2s, box-shadow .2s;
  }
  .stat:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .stat .num {
    font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg,var(--pink),var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat:nth-child(2) .num { background: linear-gradient(135deg,var(--orange),var(--pink)); -webkit-background-clip:text; background-clip:text; }
  .stat:nth-child(3) .num { background: linear-gradient(135deg,var(--green),var(--cyan)); -webkit-background-clip:text; background-clip:text; }
  .stat:nth-child(4) .num { background: linear-gradient(135deg,var(--cyan),var(--blue)); -webkit-background-clip:text; background-clip:text; }
  .stat.playing { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,209,102,.35); }
  .stat.playing .num { animation: pulse 1.2s ease-in-out infinite; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .layout { display:grid; grid-template-columns: 1.62fr 1fr; gap:20px; }
  .panel {
    background: var(--card); border:1px solid var(--border); border-radius:20px;
    padding: 18px; backdrop-filter: blur(10px);
  }
  /* ★ 地图面板去掉 backdrop-filter —— WebGL canvas 在里面, 每帧重算模糊会拖垮性能
     (老板 09-16 反馈卡顿; 地图本身深色不透明, 视觉无差别) */
  #map-panel {
    backdrop-filter: none;
    background: linear-gradient(160deg, #141628 0%, #0e1020 100%);
  }
  /* 胶片条同理(紧邻 canvas, 也是大面积模糊) */
  .map-3d .film-strip, #map-panel .film-strip { backdrop-filter: none; background: rgba(20,22,40,.92); }
  #map { width:100%; height: 780px; }
  /* overflow:hidden —— 照片 pin 不许溢出到隔壁胶片条上(老板 09-16 反馈) */
  #map-wrap { position: relative; flex:1; min-width:0; height:780px; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .map-row { display:flex; gap:14px; align-items:stretch; }
  #map-overlay { position:absolute; inset:0; pointer-events:none; z-index:10; }
  /* 地图操作提示: 左下角, 半透明不抢戏 */
  .map-hint {
    position:absolute; left:10px; bottom:8px; z-index:12; pointer-events:none;
    font-size:11px; color:var(--muted); letter-spacing:.5px;
    background: rgba(10,12,24,.62); border:1px solid rgba(255,255,255,.1);
    border-radius:999px; padding:4px 12px;
    backdrop-filter: blur(4px);
  }
  .map-hint .hint-touch { display:none; }
  /* 窄屏直接切触摸文案(比 @media(hover) 可靠, 无头浏览器也能正确判定) */
  @media (max-width: 939px) {
    .map-hint .hint-desk { display:none; }
    .map-hint .hint-touch { display:inline; }
  }
  @media (hover: none) and (pointer: coarse) {
    .map-hint .hint-desk { display:none; }
    .map-hint .hint-touch { display:inline; }
  }
  /* 地图浮层照片卡 */
  .map-pin {
    position:absolute; pointer-events:auto; cursor:pointer;
    transform: translate(-50%, -50%);
    transition: transform .18s ease, filter .18s ease, opacity .7s ease;
    opacity:0;  /* 开屏动画与足迹点同步点亮 */
  }
  .map-pin.lit { opacity:1; }
  .map-pin:hover { transform: translate(-50%, -50%) scale(1.15); filter: brightness(1.15); }
  .map-pin .pin-photo {
    width:52px; height:52px; border-radius:50%;
    object-fit:cover; border:2.5px solid rgba(255,255,255,.85);
    box-shadow: 0 4px 16px rgba(0,0,0,.5), 0 0 12px rgba(255,209,102,.5);
  }
  .map-pin .pin-ring {
    position:absolute; inset:-6px; border-radius:50%;
    border:1.5px dashed rgba(255,209,102,.7);
    animation: pinSpin 9s linear infinite;
    pointer-events:none;
  }
  @keyframes pinSpin { to { transform: rotate(360deg); } }
  .map-pin.home .pin-photo { border-color: var(--gold); }
  /* 浮层记忆卡(hover 弹出) */
  .map-card {
    position:absolute; pointer-events:none; z-index:11;
    min-width:190px; max-width:240px;
    background: rgba(12,14,26,.92); border:1px solid rgba(255,209,102,.4);
    border-radius:12px; padding:10px 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 28px rgba(0,0,0,.6);
    opacity:0; transform: translateY(6px) scale(.96);
    transition: opacity .18s ease, transform .18s ease;
    font-size:12px; line-height:1.55;
  }
  .map-card.show { opacity:1; transform: translateY(0) scale(1); }
  .map-card .mc-city { font-size:14px; font-weight:700; color:var(--gold); margin-bottom:3px; }
  .map-card .mc-since { color:var(--green); font-size:11px; }
  .map-card .mc-note { color:var(--text); margin-top:4px; }
  /* AI 补位的描述标注(老板手写的不标) */
  .ai-mark {
    display:inline-block; font-size:9px; line-height:1.5; padding:0 4px;
    margin-right:5px; border-radius:4px; vertical-align:1px;
    background:rgba(122,140,255,.18); color:#a8b4ff; border:1px solid rgba(122,140,255,.35);
    font-family:ui-monospace,monospace; letter-spacing:.5px;
  }
  .map-card .mc-imgs { display:flex; gap:4px; margin-top:6px; }
  .map-card .mc-imgs img {
    width:40px; height:40px; border-radius:6px; object-fit:cover;
    border:1px solid rgba(255,255,255,.25);
  }
  .map-card .mc-count { color:var(--muted); font-size:10px; margin-top:3px; }
  /* 小 pin(默认): 比大 pin 小一圈 */
  .map-pin.small .pin-photo { width:26px; height:26px; border-width:1.5px; }
  .map-pin.small .pin-ring { inset:-3px; border-width:1px; }
  /* 放大后小 pin 升格(临时类, 缩回自动还原) */
  .map-pin.small.zoom-big .pin-photo { width:44px; height:44px; border-width:2.5px; }
  .map-pin.small.zoom-big .pin-ring { inset:-6px; border-width:1.5px; }

  /* ═══ 3D 版式(老板 09-16 拍板: 照片直接钉在各自城市上) ═══
     小圆角方块, 不避让、位置准; 悬停放大看细节 */
  /* 尺寸 × --pin-scale(随缩放反向调整, 由 applyZoomFold 写入) */
  .map-3d .map-pin .pin-photo {
    width: calc(40px * var(--pin-scale, 1));
    height: calc(40px * var(--pin-scale, 1));
    border-radius: 9px;
    border: 1.5px solid rgba(255,255,255,.72);
    box-shadow: 0 3px 12px rgba(0,0,0,.65), 0 0 10px rgba(255,209,102,.4);
  }
  .map-3d .map-pin .pin-ring { inset: -4px; border-radius: 12px; border-width: 1px; }
  .map-3d .map-pin.home .pin-photo {
    width: calc(52px * var(--pin-scale, 1));
    height: calc(52px * var(--pin-scale, 1));
    border: 2.5px solid var(--gold);
    box-shadow: 0 4px 18px rgba(0,0,0,.7), 0 0 20px rgba(255,209,102,.85);
  }
  .map-3d .map-pin.home .pin-ring { inset: -7px; border-radius: 14px; border-width: 1.5px; }
  /* 悬停: 放大 + 抬高, 看得清是哪张 */
  .map-3d .map-pin:hover { z-index: 20; transform: translate(-50%,-50%) scale(1.7); filter: none; }
  .map-3d .map-pin:hover .pin-photo { box-shadow: 0 8px 26px rgba(0,0,0,.85), 0 0 26px rgba(255,209,102,.95); }
  /* 缩放到很近时整体放大 */
  .map-3d .map-pin.small.zoom-big .pin-photo { width: 44px; height: 44px; }

  /* ═══ 3D 旋转照片环(老板 2026-09-15 晚创意: 常驻窗口, 全方位展示) ═══ */
  /* 3D 照片环: 地图下方的附属条, 不单独成框(老板 09-16: 之前太大喧宾夺主) */
  .stage3d {
    position:relative; margin-top:6px; height:190px;
    overflow:hidden;
    /* 无边框、无底色, 融进地图面板 */
    background: radial-gradient(ellipse at 50% 46%, rgba(122,140,255,.10), transparent 68%);
    /* 透视距离大 → 近大远小更平缓, 卡片不易甩出框 */
    perspective: 1500px; perspective-origin: 50% 48%;
    cursor:grab; user-select:none;
    touch-action: pan-y;   /* 手机上纵向滚动照常, 横向滑动转环 */
  }
  .stage3d.grabbing { cursor:grabbing; }
  .s3d-hint {
    position:absolute; top:2px; left:0; right:0; text-align:center; z-index:3;
    font-size:9px; color:var(--muted); letter-spacing:1.5px; pointer-events:none;
    opacity:.65;
  }
  /* 地面光晕: 环的倒影感 */
  .stage3d::after {
    content:''; position:absolute; left:50%; bottom:-64px; transform:translateX(-50%);
    width:620px; height:150px; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(79,209,255,.2), rgba(255,209,102,.09) 42%, transparent 72%);
    filter: blur(22px);
  }
  .s3d-scene {
    position:absolute; inset:0;
    transform-style: preserve-3d;
    transform: rotateX(7deg);   /* 环面微前倾(扁平条里角度要小, 否则前排卡片被顶出框) */
  }
  /* 自转由 JS 驱动(拖拽与自转共用同一角度, 避免 CSS 动画打架) */
  .s3d-ring {
    /* 圆心略低于容器中心: 上圈卡片抬升后仍在框内 */
    position:absolute; left:50%; top:52%;
    width:0; height:0;
    transform-style: preserve-3d;
  }
  .s3d-card {
    position:absolute; left:0; top:0;
    width:92px; height:122px; margin:-61px 0 0 -46px;
    border-radius:10px; overflow:hidden; cursor:pointer;
    border:1.5px solid rgba(255,255,255,.28);
    box-shadow: 0 6px 22px rgba(0,0,0,.55);
    background:#0d1020;
    transition: border-color .3s ease, box-shadow .3s ease;
    /* 不用 backface-visibility:hidden —— 环上总有一半卡片背对观察者,
       隐藏后成片消失, 窄屏上看着就是一段黑屏(老板 2026-09-21 反馈) */
  }
  /* 下圈略暗: 制造前后层次 */
  .s3d-card.ring-lower { filter: brightness(.88) saturate(.94); }
  .s3d-card.ring-lower:hover { filter: brightness(1.05); }
  .s3d-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .s3d-card .c3d-name {
    position:absolute; left:0; right:0; bottom:0; padding:3px 2px 4px;
    font-size:11px; font-weight:600; color:#fff; text-align:center;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    text-shadow: 0 1px 3px #000;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .s3d-card:hover {
    border-color: var(--gold);
    box-shadow: 0 10px 32px rgba(0,0,0,.7), 0 0 22px rgba(255,209,102,.55);
  }
  .s3d-card.is-home { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,209,102,.5); }

  /* 右侧多列胶片条(辅助栏, 老板 2026-09-15: 一列放不下就多放几列) */
  /* 胶片条: 多列网格(老板 09-16 "5 张摆不下就分列")
     每列最多 6 格, 列数按总数自动增减; 列间可横向滚动 */
  .film-strip {
    width:auto; flex:none; max-width:206px; padding:12px 10px;
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    backdrop-filter: blur(10px); display:flex; flex-direction:column;
  }
  .film-strip .fs-label { font-size:10px; color:var(--muted); margin-bottom:8px; letter-spacing:1px; text-align:center; }
  .film-strip .fs-row {
    flex:1; display:grid;
    /* 每列 6 格, 行数固定 6, 列数按内容自动增 */
    grid-template-rows: repeat(6, 52px);
    grid-auto-flow: column;
    grid-auto-columns: 52px;
    gap:7px;
    justify-content:center; align-content:start;
    overflow-x:auto; overflow-y:hidden;
    padding-bottom:3px;
  }
  .film-strip .fs-row::-webkit-scrollbar { height:5px; width:5px; }
  .film-strip .fs-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius:3px; }

  /* ── 3D 滚动效果(老板 09-16: 胶片也要有点 3D) ──
     景深值走 CSS 变量(--dz/--dy/--db), JS 只改变量不改 transform,
     这样 :hover 的立体翻转还能叠加生效 */
  .film-strip { perspective: 900px; }
  .film-strip .fs-row { transform-style: preserve-3d; }
  .fs-cell {
    flex:none; width:52px; cursor:pointer; position:relative;
    transform-style: preserve-3d;
    /* 默认由变量驱动(JS 写入); 未写入时是平贴 */
    transform: translateZ(var(--dz, 0px)) rotateY(var(--dy, 0deg));
    filter: brightness(var(--db, 1));
    transition: transform .28s cubic-bezier(.2,.8,.3,1), filter .28s;
    will-change: transform;
  }
  /* 悬停: 在景深基础上再抬起 + 前倾 + 放大 */
  .fs-cell:hover {
    transform:
      translateZ(calc(var(--dz, 0px) + 44px))
      rotateY(var(--dy, 0deg)) rotateX(-9deg) scale(1.16);
    filter: brightness(1.2);
    z-index: 3;
  }
  .fs-cell:hover img {
    border-color: var(--gold);
    box-shadow: 0 12px 26px rgba(0,0,0,.75), 0 0 20px rgba(255,209,102,.7);
  }
  .fs-cell img {
    width:52px; height:52px; border-radius:8px; object-fit:cover;
    border:2px solid rgba(255,255,255,.2); box-shadow: 0 2px 8px rgba(0,0,0,.4);
    transition: opacity .22s ease, border-color .25s, box-shadow .25s;
  }
  .fs-cell .fs-city {
    position:absolute; bottom:-2px; left:0; right:0; text-align:center;
    font-size:9px; color:var(--gold); text-shadow: 0 1px 3px rgba(0,0,0,.9);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fs-cell.active img { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,209,102,.6); }
  .panel h2 { font-size: 16px; margin-bottom: 14px; letter-spacing:.5px; }
  .panel h2 .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background: linear-gradient(135deg,var(--gold),var(--pink)); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 12px var(--gold); } }

  .prov-group { margin-bottom: 14px; }
  .prov-name { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 2px; }
  .city-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    position: relative;
    background: rgba(255,255,255,.06); border:1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; font-size: 13px; cursor: pointer; color: var(--text);
    transition: all .18s ease; user-select: none;
  }
  .chip:hover { transform: scale(1.08); border-color: var(--gold); color: var(--gold); }
  .chip.home {
    background: linear-gradient(135deg,#ffd166,#ff9e5e); color:#241a05;
    font-weight:700; border-color: transparent;
    box-shadow: 0 0 14px rgba(255,209,102,.45);
  }
  .chip.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(79,209,255,.5); }
  .chip .cam {
    display:inline-block; margin-left:5px; font-size:10px; padding:1px 5px;
    background: rgba(122,140,255,.35); border-radius: 8px; color:#cfd6ff;
  }
  .chip .cam.since {
    background: rgba(123,241,168,.18); color:#9ff0c0;
  }
  .view-toggle {
    margin-left:12px; font-size:11px; padding:4px 10px; cursor:pointer;
    background: rgba(255,255,255,.06); border:1px solid var(--border);
    border-radius:999px; color:var(--muted); transition:all .18s;
  }
  .view-toggle:hover, .view-toggle.on { border-color:var(--green); color:var(--green); }
  .timeline-item {
    display:flex; align-items:baseline; gap:10px; padding:8px 10px;
    border-radius:10px; margin-bottom:4px; cursor:pointer;
    background: rgba(255,255,255,.03); border:1px solid transparent;
    transition: all .18s;
  }
  .timeline-item:hover { border-color:var(--border); background: rgba(255,255,255,.06); }
  .timeline-item .t-date { font-family:var(--mono, monospace); font-size:12px; color:var(--green); min-width:76px; }
  .timeline-item .t-name { font-size:14px; font-weight:600; }
  .timeline-item .t-prov { font-size:11px; color:var(--muted); }
  .timeline-item.active { border-color: var(--cyan); box-shadow: 0 0 10px rgba(79,209,255,.35); }

  /* 相册灯箱 */
  .lightbox {
    position: fixed; inset:0; z-index: 50; display:none;
    background: rgba(4,5,12,.93); backdrop-filter: blur(10px);
    align-items:center; justify-content:center; flex-direction:column;
    width:100vw; height:100vh; overflow:hidden;   /* 同剧场: 避开滚动条挤偏 */
  }
  .lightbox.open { display:flex; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity:0; } }
  /* 灯箱用固定高度的舞台, 缩放走 transform(老板 2026-09-15: 原 max-* 方案放大后把控制条顶出屏幕) */
  .lightbox .lb-stage {
    position: relative; flex:none;
    width: 88vw; height: 62vh;                 /* 固定舞台, 给下方信息条留位 */
    display:flex; align-items:center; justify-content:center;
    overflow: hidden;                          /* 放大后超出部分裁掉, 不挤压下方 */
  }
  #lb-media-box {
    position:relative; display:flex;
    align-items:center; justify-content:center;
    width:100%; height:100%;
  }
  #lb-media-box img, #lb-media-box video {
    max-width:100%; max-height:100%;
    border-radius: 12px;
    box-shadow: 0 20px 70px rgba(0,0,0,.7);
    /* 缩放 + 平移(放大后拖拽看边缘) */
    transform: translate(var(--lb-pan-x, 0px), var(--lb-pan-y, 0px)) scale(var(--lb-zoom, 1));
    transition: transform .15s ease;
    cursor: grab;
    animation: popIn .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .lightbox .lb-stage:active #lb-media-box img,
  .lightbox .lb-stage:active #lb-media-box video { cursor: grabbing; }
  /* 拖拽中关掉过渡, 否则跟手有延迟 */
  .lightbox .lb-stage.dragging #lb-media-box img,
  .lightbox .lb-stage.dragging #lb-media-box video { transition: none; }
  @keyframes popIn { from { transform: scale(.92); opacity:.4; } }
  .lb-nav {
    position:absolute; top:50%; transform:translateY(-50%);
    background: rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    color:#fff; width:44px; height:44px; border-radius:50%;
    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: background .15s;
  }
  .lb-nav:hover { background: rgba(255,255,255,.28); }
  .lb-prev { left:-58px; } .lb-next { right:-58px; }
  .lb-title { margin-top:16px; font-size:16px; font-weight:600; }
  .lb-count { margin-top:4px; font-size:12px; color:var(--muted); }
  .lb-close {
    position:absolute; top:22px; right:26px; font-size:32px; color:#fff;
    cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background: rgba(255,255,255,.1); transition: background .15s, transform .15s;
  }
  .lb-close:hover { background: rgba(255,93,143,.5); transform: rotate(90deg); }
  .lb-note {
    margin-top:10px; font-size:14px; color:var(--gold);
    max-width:80vw; text-align:center; line-height:1.6;
    padding: 8px 18px; background: rgba(255,209,102,.08); border-radius: 12px;
  }
  /* 灯箱缩放滑条 */
  /* 缩放提示条(滚轮/双指交互, 无滑条) */
  .lb-zoom {
    margin-top:12px; display:flex; align-items:center; gap:14px;
    background: rgba(255,255,255,.05); border:1px solid var(--border);
    border-radius:999px; padding:6px 18px;
    font-size:12px; color:var(--muted);
  }
  .lb-zoom .lz-hint { letter-spacing:.5px; }
  .lb-zoom .lz-val {
    color:var(--gold); font-variant-numeric: tabular-nums; font-weight:600;
  }
  /* 放大后舞台显示抓手光标, 提示可拖 */
  .lb-stage { cursor: grab; }
  .lb-stage.dragging { cursor: grabbing; }

  /* 成就墙 */
  .achieve-panel {
    max-width: 640px; width: 92vw; max-height: 80vh; overflow-y:auto;
    background: var(--card); border:1px solid var(--border); border-radius:20px;
    padding: 28px; backdrop-filter: blur(14px);
  }
  .achieve-title { font-size:22px; font-weight:800; text-align:center; margin-bottom:20px; }
  .achieve-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .achieve-item {
    background: rgba(255,255,255,.05); border:1px solid var(--border); border-radius:14px;
    padding:14px; text-align:center; transition: transform .2s, border-color .2s;
  }
  .achieve-item:hover { transform: translateY(-3px); border-color: var(--gold); }
  .achieve-item .a-ico { font-size:28px; margin-bottom:6px; }
  .achieve-item .a-name { font-size:13px; font-weight:600; }
  .achieve-item .a-desc { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .achieve-item.locked { opacity:.38; filter:grayscale(.7); }
  .achieve-item.locked:hover { transform:none; border-color:var(--border); }

  /* 剧场浮层 · 照片轮播 */
  .theater {
    position:fixed; inset:0; z-index:60; display:none;
    background: rgba(4,5,12,.96); backdrop-filter: blur(14px);
    align-items:center; justify-content:center; flex-direction:column;
    /* 满屏浮层不受页面滚动条影响(老板 2026-09-15 晚: 修居中偏 7px) */
    width:100vw; height:100vh; overflow:hidden;
  }
  .theater.open { display:flex; animation: fadeIn .3s ease; }
  .th-close {
    position:absolute; top:22px; right:26px; font-size:32px; color:#fff;
    cursor:pointer; width:48px; height:48px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background: rgba(255,255,255,.1); transition: background .15s, transform .15s;
    z-index:2;
  }
  .th-close:hover { background: rgba(255,93,143,.5); transform: rotate(90deg); }
  /* 暂停键: 挂在图片框左上角外 */
  .th-pause {
    position:absolute; left:-56px; top:0;
    z-index:2; width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s, transform .15s;
  }
  .th-pause:hover { background: rgba(79,209,255,.35); transform:scale(1.1); }
  /* 舞台 = 图片框本身, 由 theater 的 flex 精确居中; 标题/注释浮动在框外
     (老板 2026-09-15 晚: 标题在上注释在下会把图片挤偏, 改浮动后图片永远在正中) */
  .th-stage { position:relative; display:block; text-align:center; }
  .th-city {
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    margin-bottom:14px; white-space:nowrap;
    font-size:26px; font-weight:800;
    background: linear-gradient(90deg,#ff5d8f,#ffd166,#7bf1a8,#4fd1ff,#c084fc);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  /* 注释 + 进度条打包在图片框正下方, 高度随文案变化也不影响图片居中 */
  .th-below {
    position:absolute; top:100%; left:50%; transform:translateX(-50%);
    margin-top:14px; width:100%;
  }
  /* 双层交叉淡入: 两槽都绝对定位叠放, frame 尺寸由 JS 固定
     (老板 2026-09-15 晚: 旧槽清空后 frame 塌陷 200px, 图片突然跳位 → 尺寸改由 JS 算好并锁定) */
  .th-frame {
    position:relative; width:78vw; height:58vh;   /* 初值, JS 按图片比例重设 */
    display:flex; align-items:center; justify-content:center;
    transition: width .7s ease, height .7s ease;
  }
  .th-media-slot {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .th-media-slot img, .th-media-slot video {
    max-width:100%; max-height:100%; border-radius:14px;
    box-shadow: 0 24px 80px rgba(0,0,0,.8);
    display:block;
  }
  .th-media-slot.fade-out { animation: thFadeOut .9s ease forwards; }
  .th-media-slot.fade-in { animation: thFadeIn .9s ease forwards; }
  @keyframes thFadeOut { to { opacity:0; } }
  @keyframes thFadeIn { from { opacity:0; transform:scale(1.03); } to { opacity:1; transform:scale(1); } }
  /* 周边动态: 呼吸光晕 */
  .th-glow {
    position:absolute; inset:-26px; border-radius:24px; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(255,209,102,.22), rgba(255,93,143,.12) 45%, transparent 72%);
    animation: thGlow 3s ease-in-out infinite;
    filter: blur(10px);
    z-index:-1;
    transition: opacity .6s;
  }
  .th-glow.off { opacity:0; }
  @keyframes thGlow {
    0%,100% { transform: scale(1); opacity:.75; }
    50% { transform: scale(1.06); opacity:1; }
  }
  /* 周边动态: 旋转星尘 */
  .th-sparkle { position:absolute; pointer-events:none; z-index:-1; }
  .th-spark {
    position:absolute; width:5px; height:5px; border-radius:50%;
    background: #ffd166;
    box-shadow: 0 0 8px 2px rgba(255,209,102,.7);
    animation: thSpark 2.6s ease-in-out infinite;
  }
  @keyframes thSpark {
    0%,100% { opacity:0; transform: translateY(0) scale(.4); }
    50% { opacity:1; transform: translateY(-18px) scale(1.15); }
  }
  /* 周边动态: 环绕流光弧 */
  .th-arc {
    position:absolute; inset:-38px; pointer-events:none; z-index:-1;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color: rgba(79,209,255,.5);
    border-right-color: rgba(192,132,252,.35);
    animation: thArc 8s linear infinite;
    transition: opacity .6s;
  }
  .th-arc.off { opacity:0; }
  @keyframes thArc { to { transform: rotate(360deg); } }
  .th-arc.reverse { animation-direction: reverse; animation-duration: 11s; inset:-52px; }
  .th-note {
    /* margin-top 由 .th-below 统一给, 这里不再重复 */
    font-size:21px; font-weight:600; color:var(--gold); min-height:34px;
    padding: 10px 26px; background: rgba(255,209,102,.1); border-radius: 999px;
    display:inline-block; max-width:70vw;
    text-shadow: 0 2px 12px rgba(255,209,102,.35);
    animation: noteGlow 2.4s ease-in-out infinite;
  }
  @keyframes noteGlow {
    0%,100% { text-shadow: 0 2px 12px rgba(255,209,102,.3); transform: scale(1); }
    50% { text-shadow: 0 2px 22px rgba(255,209,102,.65); transform: scale(1.04); }
  }
  .th-progress {
    margin:14px auto 0; width:min(420px, 60vw); height:5px;
    background: rgba(255,255,255,.12); border-radius:3px; overflow:hidden;
  }
  .th-bar { height:100%; width:0%; border-radius:3px;
    background: linear-gradient(90deg,#ff5d8f,#ffd166,#7bf1a8);
    transition: width .1s linear; }
  @keyframes fadeIn { from { opacity:0; } }

  .footer { margin-top:24px; text-align:center; color:var(--muted); font-size:12px; }
  .footer .moon { font-size:15px; }

  /* 编辑弹窗 */
  .edit-panel {
    text-align:left; padding: 26px;
    background: var(--card); border:1px solid var(--border); border-radius:20px;
    backdrop-filter: blur(14px); max-width:440px; width:92vw;
  }
  .edit-title { font-size:18px; font-weight:700; margin-bottom:16px; }
  .edit-label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
  .edit-input {
    width:100%; padding:10px 14px; font-size:14px;
    background: rgba(255,255,255,.06); border:1px solid var(--border);
    border-radius:10px; color:var(--text); outline:none;
    font-family: inherit; resize:vertical;
  }
  .edit-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(79,209,255,.12); }
  .edit-actions { display:flex; gap:10px; margin-top:18px; }
  .edit-hint { font-size:11px; color:var(--muted); margin-top:10px; }
  .city-pick-list { max-height: 56vh; overflow-y:auto; margin: 8px 0; }
  .city-pick-row {
    display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;
    border-radius:8px; font-size:14px; transition: background .15s;
  }
  .city-pick-row:hover { background: rgba(255,255,255,.08); }
  .pick-status { width:22px; font-size:12px; }
  .pick-name { font-weight:600; }
  .pick-prov { font-size:11px; color:var(--muted); margin-left:auto; }

  /* ═══════════════════════════════════════════════════════════
     双端适配(老板 2026-09-15 晚: 电脑版 + 手机版两套比例)
     断点: ≥1200 大屏电脑 | 940-1199 小电脑 | 641-939 平板 | ≤640 手机
     ═══════════════════════════════════════════════════════════ */

  /* ── 小电脑 (940-1199): 侧栏收窄, 地图略降 ── */
  @media (max-width: 1199px) {
    #map, #map-wrap { height: 660px; }
    .film-strip { width: 170px; }
    .stage3d { height: 175px; }
    .header h1 { font-size: 28px; }
  }

  /* ── 平板 & 手机 (≤939): 单列纵向, 地图降高 ── */
  @media (max-width: 939px) {
    /* minmax(0,1fr) 而非 1fr —— 胶片条 39 格的固有宽度会把 auto 撑破,
       导致整页横向溢出(老板 2026-09-21 实测 scrollW 469 > vw 375) */
    .layout { grid-template-columns: minmax(0, 1fr); gap:16px; }
    .panel { min-width: 0; }
    .map-row { flex-direction:column; }
    /* 胶片条: JS 已把它挪到旋转环下方, 这里设成通栏横排(老板 2026-09-21) */
    /* 基础样式是 max-width:206px, 这里要放开 —— 注意 max-width 不接受 none,
       写 100% 才能覆盖(写 none 会被整条丢弃) */
    .film-strip { width:100%; max-width:100%; height:auto; max-height:150px; margin-top:12px; }
    /* 格子最小 52px、可拉伸铺满 —— 原 repeat(auto-fill, 52px) 是固定宽,
       不足整数格时右侧留一条空白(老板 2026-09-21 反馈) */
    .film-strip .fs-row {
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      max-height:124px; overflow-y:auto; overflow-x:hidden;
    }
    #map, #map-wrap { height: 56vh; min-height: 340px; }
    /* 旋转环: 通栏后宽度变大, 环形也该更舒展(卡片更大更好点) */
    .stage3d { height: 200px; margin-top: 14px; }
    .panel { padding: 14px; border-radius: 16px; }
    .panel h2 { font-size: 15px; }
    .header h1 { font-size: 24px; }
    .header .sub { font-size: 13px; }
    .stats { gap: 10px; margin: 14px 0 18px; }
    .stat { padding: 10px 14px; min-width: 92px; border-radius: 13px; }
    .stat .num { font-size: 23px; }
    .stat .label { font-size: 11px; }
    /* 地图 pin 缩小(手指点得中即可) */
    .map-pin .pin-photo { width: 42px; height: 42px; border-width: 2px; }
    .map-pin.small .pin-photo { width: 26px; height: 26px; }
    .map-pin:hover { transform: translate(-50%,-50%) scale(1.08); }
    /* 记忆卡避免超出窄屏 */
    .map-card { min-width: 160px; max-width: 200px; font-size: 11px; }
    .map-card .mc-imgs img { width: 34px; height: 34px; }
    /* 灯箱: 竖屏给更高空间 */
    .lightbox .lb-stage { width: 94vw; height: 56vh; }
    .lb-title { font-size: 14px; }
    .lb-note { font-size: 13px; max-width: 90vw; }
    /* 滑条加长: 手机上 120px 太窄, 手指一碰就跳过几十个百分点(老板 09-16) */
    .lb-zoom input[type="range"] { width: 190px; height: 28px; }
    .lb-prev { left: 6px; } .lb-next { right: 6px; }
    .lb-nav { width: 38px; height: 38px; font-size: 17px; background: rgba(0,0,0,.42); }
    /* 剧场: 竖屏字小一号, 暂停键挪进框内 */
    .th-city { font-size: 20px; margin-bottom: 10px; }
    .th-note { font-size: 15px; padding: 8px 16px; max-width: 88vw; }
    .th-pause { left: 8px; top: 8px; }
    .th-below { margin-top: 12px; }
    .th-progress { width: min(320px, 72vw); }
    .th-close { top: 14px; right: 14px; font-size: 26px; width: 40px; height: 40px; }
    /* 弹窗 */
    .achieve-panel { padding: 20px 16px; border-radius: 16px; }
    .achieve-grid { grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; }
    .achieve-title { font-size: 18px; }
  }

  /* ── 手机 (≤640): 更紧凑 ── */
  @media (max-width: 640px) {
    /* 底部留白: 本页已移除「返回/首页」悬浮按钮, 无需再留 84px */
    body { padding: 10px 10px 24px; }
    /* 手机: 地图高度收到 52vh —— 375x667 上原 62vh+min380 会把整页顶出屏幕,
       首屏看不到地图(2026-09-21 手机端实测) */
    #map, #map-wrap { height: 52vh; min-height: 300px; }
    /* 旋转环: 通栏且加大, 上下都留出空间让卡片环转得开(老板 2026-09-21) */
    .stage3d { height: 190px; margin-top: 12px; margin-bottom: 4px; }
    /* 手机上卡片更大, 上圈抬升后顶出容器(实测超 5px) —— 圆心压低一点 */
    .s3d-ring { top: 60%; }
    /* 手机上环几乎占满整条, 提示放哪都压卡片 —— 直接不显示(交互对触摸用户是本能) */
    .s3d-hint { display: none; }
    .s3d-hint { font-size: 10px; letter-spacing: 1px; }
    .header { gap: 8px; }
    .header h1 { font-size: 20px; letter-spacing: 0; }
    .header .sub { font-size: 11px; }
    /* 手机: 4+3 两行(7个卡在一行会各被压到 23px, 文字糊在一起)
       第一行 4 个纯数字, 第二行 3 个功能键 */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin: 12px 0 16px;
    }
    .stat { padding: 7px 4px; min-width: 0; border-radius: 10px; text-align: center; }
    .stat .num { font-size: 17px; }
    .stat .label { font-size: 9.5px; margin-top: 2px; white-space: nowrap; }
    .stat:nth-child(-n+4) .num { font-size: 16px; }
    .stat:nth-child(-n+4) .label { font-size: 9px; letter-spacing: -.3px; }
    /* 第二行 3 个功能键: 第5个跨2列起, 第6/7各1列 → 合计 4 列 */
    .stat:nth-child(5) { grid-column: 1 / span 2; padding: 9px 6px; }
    .stat:nth-child(6) { grid-column: 3 / span 1; padding: 9px 6px; }
    .stat:nth-child(7) { grid-column: 4 / span 1; padding: 9px 6px; }
    .panel { padding: 12px; }
    .panel h2 { font-size: 14px; }
    .view-toggle { font-size: 11px; padding: 4px 9px; }
    .chip { padding: 5px 11px; font-size: 12px; }
    .timeline-item { padding: 7px 10px; }
    .timeline-item .t-date { font-size: 11px; min-width: 66px; }
    .timeline-item .t-name { font-size: 13px; }
    /* 手机端地图内叠加元素收窄, 别压住地图 */
    .map-hint { font-size: 10px; padding: 3px 9px; left: 8px; bottom: 6px; max-width: 62vw; }
    .film-strip { margin-top: 8px; }
    /* 手机屏窄, 照片pin再收一档 —— 否则 39 个点挤在中东部糊成一团(2026-09-21 实测) */
    .map-3d .map-pin .pin-photo { width: calc(32px * var(--pin-scale, 1)); height: calc(32px * var(--pin-scale, 1)); border-radius: 8px; }
    .map-3d .map-pin.home .pin-photo { width: calc(42px * var(--pin-scale, 1)); height: calc(42px * var(--pin-scale, 1)); }
    /* 灯箱 */
    .lightbox .lb-stage { width: 96vw; height: 52vh; }
    .lb-zoom { gap: 8px; padding: 6px 14px; margin-top: 10px; }
    /* 手机滑条: 尽量长 + 加大触摸高度, 便于精确拖到想要的百分比 */
    .lb-zoom input[type="range"] { width: min(56vw, 220px); height: 30px; }
    .lb-zoom .lz-val { min-width: 38px; font-size: 11px; }
    .lb-close { top: 12px; right: 12px; font-size: 26px; width: 38px; height: 38px; }
    /* 剧场 */

function noteSrcOf(city) {
  const edits = loadEdits();
  if ((edits[city] || {}).note) return 'local';
  const n = NOTES[city];
  if (n && n.note) return n.src === 'ai' ? 'ai' : 'boss';
  const c = CITIES.find(x => x.name === city);
  return (c && c.note) ? 'builtin' : '';
}
function sinceOf(city) {

  if (e.since) return e.since;

  if (n && n.since) return n.since;
  const c = CITIES.find(x => x.name === city);
  return (c && c.since) || '';

// ── 媒体级描述(老板 2026-09-21 定) ──

let PHOTO_DESC = {};   // {城市: [{f:文件名, d:描述, p:人物, m:氛围, t:标签}]}

function photoDescOf(city, mediaPath) {
  const list = PHOTO_DESC[city];
  if (!list || !mediaPath) return '';
  const fn = mediaPath.split('/').pop();
  const hit = list.find(x => x.f === fn);
  return hit ? (hit.d || '') : '';
}
// 该城第 1 个媒体(视频也算)是否是这张 —— 剧场/灯箱都用 photoImgs 的顺序
function isFirstMedia(city, mediaPath) {
  const imgs = photoImgs(city);
  return imgs.length > 0 && imgs[0] === mediaPath;
}

// 按媒体取要显示的文字(不含装饰) + 来源
// mode: 'media' = 剧场/灯箱逐张; 'city' = 城市墙/记忆卡(整城视角)
function descFor(city, mediaPath) {
  const hasOwn = !!noteOf(city);          // 本地编辑/服务器/内置 任一层有内容
  const src = noteSrcOf(city);
  if (mediaPath && isFirstMedia(city, mediaPath)) {
    return { text: noteOf(city), src };

  const pd = photoDescOf(city, mediaPath);
  if (pd) return { text: pd, src: 'ai' };
  // 该张没有 AI 描述(被审核拦/视频) → 回退城市描述
  return { text: noteOf(city), src };
}

// 是否视频
const VID_EXT_RE = /\.(mp4|mov|webm|avi)$/i;
function isVideo(p) { return VID_EXT_RE.test(p); }
// 原图 → 缩略图路径(性能: pin/记忆卡用 thumb, 灯箱才加载原图)
function thumbOf(imgPath) {
  // photos/武汉/IMG_x.jpg → thumbs/武汉/IMG_x_thumb.jpg
  const parts = imgPath.split("/");
  const city = parts[1];
  const fname = parts[2];
  const stem = fname.replace(/\.[^.]+$/, "");
  return `thumbs/${city}/${stem}_thumb.jpg`;
}
// 媒体封面: 照片用缩略图, 视频用 🎬 图标(数据 URI SVG)
function mediaCover(mediaPath) {
  if (isVideo(mediaPath)) return '';
  return thumbOf(mediaPath);
}
const VID_ICON_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
  '<rect width="100" height="100" rx="18" fill="#1c1f33"/>' +
  '<circle cx="50" cy="50" r="26" fill="#ffd166"/>' +

function photoCount(city) { return photoImgs(city).length; }
// 缩略图只选照片, 视频不参与(老板 2026-09-15 晚); 该地只有视频时才退回第一项
function photoPool(city) { return photoImgs(city).filter(p => !isVideo(p)); }
