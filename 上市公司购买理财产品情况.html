const PROV_CN = {"beijing": "北京", "tianjin": "天津", "hebei": "河北", "shanxi": "山西", "neimeng": "内蒙", "liaoning": "辽宁", "jilin": "吉林", "heilongjiang": "黑龙江", "shanghai": "上海", "jiangsu": "江苏", "zhejiang": "浙江", "anhui": "安徽", "fujian": "福建", "jiangxi": "江西", "shandong": "山东", "henan": "河南", "hubei": "湖北", "hunan": "湖南", "guangdong": "广东", "guangxi": "广西", "hainan": "海南", "chongqing": "重庆", "sichuan": "四川", "guizhou": "贵州", "yunnan": "云南", "xizang": "西藏", "shaanxi": "陕西", "gansu": "甘肃", "qinghai": "青海", "ningxia": "宁夏", "xinjiang": "新疆"};

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fa(a){return a.amount? a.amount+a.unit : '';}

function byProv(){
  const m = {};
  for(const a of DATA.anns){
    const p = DATA.prov[a.code] || 'unknown';
    (m[p] = m[p] || []).push(a);
  }
  return m;
}
const BP = byProv();

function annBadges(a){
  if(a.hd===1 && a.trustee)
    return '<span class="badge blue">'+esc(a.trustee.slice(0,14))+'</span><span class="badge">'+esc(fa(a))+'</span>';
  if(a.hd===2 && a.amount)
    return '<span class="badge gold">额度 '+esc(fa(a))+'</span>';
  return '';
}
function hitHtml(a, prov){
  const pdf = a.url? '<a href="https://static.cninfo.com.cn/'+esc(a.url)+'" target="_blank" rel="noopener">PDF</a>' : '';
  return '<div class="hit"><span class="d">'+a.date+'</span><span class="t">'+esc(a.title)
       + annBadges(a) + '</span>'+pdf+'</div>';
}

function showIndex(){
  document.getElementById('crumb').innerHTML = '';
  let s = '<h1>全国上市公司闲置资金理财情报</h1>'
    + '<div class="sub">数据区间 2026-08-24 ~ '+DATA.today+' · 中邮保险资产管理有限公司 金融市场中心 · 数据源 巨潮资讯网</div>';
  let totalC = 0, totalA = DATA.anns.length;
  const seen = new Set();
  for(const a of DATA.anns) seen.add(a.code);
  totalC = seen.size;
  s += '<div class="grid"><a class="card nat" href="#" data-act="stats">'
    + '<div class="name">📊 受托方情报总览</div><div class="meta">'+totalC+' 家公司 · '+totalA+' 条公告 · 非银受托方透视/大金主TOP20</div></a></div>';
  for(const [region, provs] of REGIONS){
    s += '<h2 class="region">'+region+'</h2><div class="grid">';
    for(const [slug, cn] of provs){
      const anns = BP[slug] || [];
      const comps = new Set(anns.map(a=>a.code)).size;
      const intel = anns.filter(a=>a.hd===1||a.hd===2).length;
      s += '<a class="card" href="#" data-prov="'+slug+'"><div class="name">'+cn+'</div>'
         + '<div class="meta">'+comps+' 家 · '+anns.length+' 条 · '+intel+' 情报</div></a>';
    }
    s += '</div>';
  }
  document.getElementById('view').innerHTML = s;
  bindCards();
}

function bindCards(){
  document.querySelectorAll('a.card[data-prov]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.preventDefault(); showProv(el.dataset.prov); });
  });
  document.querySelectorAll('a.card[data-act]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.preventDefault(); showStats(); });
  });
}

function showStats(){
  document.getElementById('crumb').innerHTML = '<a class="back" href="#" onclick="showIndex();return false">← 返回首页</a>';
  const anns = DATA.anns;
  const cat = {};
  const org = {};
  for(const a of anns){
    if(a.hd!==1 || !a.trustee) continue;
    let k = '其他';
    if(a.trustee.indexOf('银行')>=0) k='银行';
    else if(a.trustee.indexOf('证券')>=0) k='证券资管';
    else if(a.trustee.indexOf('信托')>=0) k='信托';
    else if(a.trustee.indexOf('基金')>=0) k='基金';
    else if(a.trustee.indexOf('理财')>=0) k='理财子';
    cat[k]=(cat[k]||0)+1;
    if(k!=='银行') org[a.trustee]=(org[a.trustee]||0)+1;
  }
  let s = '<h1>受托方情报总览</h1><div class="sub">非银机构 = 业务对标对象 · '+DATA.today+'</div>'
    + '<div class="panel"><div class="panel-t">类型分布</div><div class="panel-b">';
  for(const [k,v] of Object.entries(cat))
    s += '<span class="badge '+(k!=='银行'?'blue':'')+'">'+k+' '+v+'</span> ';
  s += '</div></div>';
  const rows = anns.filter(a=>a.hd===1 && a.trustee && a.trustee.indexOf('银行')<0)
                   .sort((a,b)=>a.date<b.date?1:-1);
  if(rows.length){
    s += '<div class="panel"><div class="panel-t">非银受托方明细（'+rows.length+' 条）</div><div class="panel-b"><table>'
      + '<tr><th>日期</th><th>公司</th><th>受托方</th><th>产品</th><th>金额</th></tr>';
    for(const a of rows)
      s += '<tr><td>'+a.date+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.trustee)+'</td><td>'+esc((a.product||'').slice(0,26))+'</td><td>'+esc(fa(a))+'</td></tr>';
    s += '</table></div></div>';
  }
  // 大金主 TOP20
  const best = {};
  for(const a of anns){
    if(a.hd!==2 || !a.amount) continue;
    const yi = a.unit==='亿'? parseFloat(a.amount) : parseFloat(a.amount)/10000;
    if(isNaN(yi)) continue;
    if(!best[a.code] || yi>best[a.code][0]) best[a.code]=[yi,a];
  }
  const top = Object.values(best).sort((x,y)=>y[0]-x[0]).slice(0,20);
  if(top.length){
    s += '<div class="panel"><div class="panel-t">闲置资金大金主 TOP 20</div><div class="panel-b"><table>'
      + '<tr><th>#</th><th>公司</th><th>额度</th><th>投资范围</th><th>公告日</th></tr>';
    top.forEach(([yi,a],i)=>{
      s += '<tr><td>'+(i+1)+'</td><td>'+esc(a.name)+'</td><td><b>'+esc(fa(a))+'</b></td><td class="note">'+esc((a.ptype||'—').slice(0,40))+'</td><td>'+a.date+'</td></tr>';
    });
    s += '</table></div></div>';
  }
  document.getElementById('view').innerHTML = s;
}

function showProv(slug){
  document.getElementById('crumb').innerHTML = '<a class="back" href="#" onclick="showIndex();return false">← 返回首页</a>';
  const anns = BP[slug] || [];
  const byCode = {};
  for(const a of anns) (byCode[a.code]=byCode[a.code]||[]).push(a);
  const intel = anns.filter(a=>a.hd===1||a.hd===2).length;
  let s = '<h1>'+(PROV_CN[slug]||slug)+'上市公司闲置资金理财情报</h1>'
    + '<div class="sub">检索 '+DATA.today+' · 数据源 巨潮资讯网</div>'
    + '<div class="stats"><div class="c"><div class="v">'+Object.keys(byCode).length+'</div><div class="k">涉及公司</div></div>'
    + '<div class="c"><div class="v">'+anns.length+'</div><div class="k">公告总数</div></div>'
    + '<div class="c"><div class="v">'+intel+'</div><div class="k">情报条数</div></div></div>';
  const names = Object.keys(byCode).sort((x,y)=>{
    const nx = byCode[x][0].name, ny = byCode[y][0].name;
    return nx.localeCompare(ny,'zh');
  });
  for(const code of names){
    const lst = byCode[code].sort((a,b)=>a.date<b.date?1:-1);
    const nd = lst.filter(a=>a.hd===1).length, nq = lst.filter(a=>a.hd===2).length;
    s += '<div class="comp"><div class="comp-h" data-code="'+code+'" onclick="toggleC(this)">'
      + '<span class="caret">▸</span><span class="cn">'+esc(lst[0].name)+'</span><span class="code">'+code+'</span>'
      + (nd?'<span class="badge">明细 '+nd+'</span>':'')
      + (nq?'<span class="badge gold">额度 '+nq+'</span>':'')
      + '<span class="badge cyan">'+lst.length+' 条</span></div>'
      + '<div class="comp-b">'+lst.map(a=>hitHtml(a)).join('')+'</div></div>';
  }
  document.getElementById('view').innerHTML = s;
  document.querySelectorAll('.comp-h[data-code]').forEach(function(el){
    el.addEventListener('click', function(){ showComp(el.dataset.code); });
  });
}

function toggleC(el){ el.parentElement.classList.toggle('open'); }

function showComp(code){
  const anns = DATA.anns.filter(a=>a.code===code).sort((a,b)=>a.date<b.date?1:-1);
  if(!anns.length) return;
  const name = anns[0].name;
  const prov = DATA.prov[code];
  document.getElementById('crumb').innerHTML =
    '<a class="back" href="#" data-back="'+(prov||'beijing')+'">← 返回'+(PROV_CN[prov]||'')+'</a>';
  const nd = anns.filter(a=>a.hd===1&&a.trustee);
  const nq = anns.filter(a=>a.hd===2&&a.amount);
  let s = '<h1>'+esc(name)+' 闲置资金理财情报</h1>'
    + '<div class="sub">证券代码 '+code+' · '+DATA.today+'</div>';
  if(nd.length){
    s += '<div class="panel"><div class="panel-t">受托方明细（'+nd.length+'）</div><div class="panel-b"><table>'
      + '<tr><th>日期</th><th>受托方</th><th>产品</th><th>金额</th></tr>';
    for(const a of nd)
      s += '<tr><td>'+a.date+'</td><td>'+esc(a.trustee)+'</td><td>'+esc((a.product||'').slice(0,28))+'</td><td>'+esc(fa(a))+'</td></tr>';
    s += '</table></div></div>';
  }
  if(nq.length){
    s += '<div class="panel"><div class="panel-t">额度授权（'+nq.length+'）</div><div class="panel-b"><table>'
      + '<tr><th>日期</th><th>额度</th><th>投资范围</th></tr>';
    for(const a of nq)
      s += '<tr><td>'+a.date+'</td><td><b>'+esc(fa(a))+'</b></td><td class="note">'+esc((a.ptype||'—').slice(0,44))+'</td></tr>';
    s += '</table></div></div>';
  }
  s += '<div class="panel"><div class="panel-t">全部公告（'+anns.length+'）</div><div class="panel-b">'
    + anns.map(a=>hitHtml(a)).join('') + '</div></div>';
  document.getElementById('view').innerHTML = s;
  document.querySelectorAll('#crumb a[data-back]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.preventDefault(); showProv(el.dataset.back); });
  });
  window.scrollTo(0,0);
}

showIndex();
</script>
