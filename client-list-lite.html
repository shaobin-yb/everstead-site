*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;padding-bottom:24px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 16px}
.stat b{font-size:1.25rem;display:block}
.stat span{font-size:.78rem;opacity:.85}
.toolbar{background:rgba(7,16,33,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(20,30,60,.05)}
.toolbar .inner{display:flex;gap:12px;align-items:center;padding:12px 0 0;flex-wrap:wrap}
#search{flex:1;min-width:240px;padding:9px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:.95rem;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--accent)}
#clearBtn{display:none;padding:9px 16px;border:none;border-radius:9px;background:var(--chip);color:var(--sub);font-size:.88rem;cursor:pointer}
#clearBtn:hover{background:#e2e6ee}
.tabs{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);font-size:.88rem;cursor:pointer;transition:all .15s}

.city-head{margin:14px 0 8px;font-size:.92rem;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:8px}
.city-head::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:box-shadow .15s,border-color .15s}

.city{font-size:.72rem;color:var(--sub)}
.empty{display:none;text-align:center;color:var(--sub);padding:60px 0;font-size:1rem}
footer{color:var(--sub);font-size:.8rem;text-align:center;padding:0 20px 40px}

.gate-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:38px 44px;box-shadow:0 12px 40px rgba(0,0,0,.25)}

.gate h2{font-size:20px;font-weight:700;margin-bottom:8px}

.gate .err-msg{display:none;color:#f87171;font-size:.8rem;margin-top:12px}
.gate.err .err-msg{display:block}
.gate.err{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (max-width:760px){

</style>

const tabsBar = document.getElementById('tabs');
let activeCat = '';
function mkTab(label, cnt) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab';
  b.innerHTML = `${label}<span class="n">${cnt}</span>`;
  b.addEventListener('click', () => {
    activeCat = (label === '全部') ? '' : label;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
    renderAll();
  });
  tabsBar.appendChild(b);

}

// 渲染省份
const main = document.getElementById('main');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderProvince(p, keyword, typeF){
  const cityGroups = new Map();
  p.clients.forEach(c => {
    const k = c.city || '未标注城市';
    if(!cityGroups.has(k)) cityGroups.set(k, []);
    cityGroups.get(k).push(c);
  });
  const sec = document.createElement('section');
  sec.className = 'prov'; sec.id = p.name;
  sec.innerHTML = `<div class="prov-head"><h2>${esc(p.name)}</h2><span class="n">${p.count} 家</span></div>`;
  const sortedCities = [...cityGroups.keys()].sort();
  sortedCities.forEach(city => {
    const list = cityGroups.get(city);
    const div = document.createElement('div');
    div.className = 'city-block';
    div.innerHTML = `<div class="city-head">${esc(city)} · ${list.length}</div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = c.name; card.dataset.biz = c.biz; card.dataset.city = c.city || '';
      card.innerHTML = `
        <div class="nm">${esc(c.name)}</div>
        <div class="meta">
          <span class="tag ${typeColor(c.biz)}">${esc(c.biz)}</span>
          ${c.city ? `<span class="city">📍${esc(c.city)}</span>` : ''}
        </div>`;
      grid.appendChild(card);
    });
    div.appendChild(grid);
    sec.appendChild(div);
  });
  main.appendChild(sec);
}
function renderAll(){
  main.innerHTML = '';
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  DATA.provinces.forEach(p => {
    const visible = p.clients.filter(c => {
      const okK = !kw || c.name.toLowerCase().includes(kw) || (c.city||'').toLowerCase().includes(kw) || c.biz.toLowerCase().includes(kw);
      const okC = !activeCat || (c.category || '其他') === activeCat;
      return okK && okC;
    });
    if(!visible.length) return;
    const provCopy = {...p, clients: visible, count: visible.length};
    renderProvince(provCopy, kw, activeCat);
    shown += visible.length;
  });
  document.getElementById('emptyTip').style.display = shown ? 'none' : 'block';
  // 导航高亮按需
  document.querySelectorAll('nav.side a').forEach(a => {
    const pid = a.getAttribute('href').slice(1);
    a.style.display = document.getElementById(pid) ? '' : 'none';
  });
}
document.getElementById('search').addEventListener('input', renderAll);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  activeCat = '';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.textContent.startsWith('全部')));
  renderAll();
});
// 清除按钮显隐
document.getElementById('search').addEventListener('input', () => {
  document.getElementById('clearBtn').style.display = (document.getElementById('search').value || activeCat) ? '' : 'none';
});
// 导航点击高亮
nav.addEventListener('click', e => {
  const a = e.target.closest('a'); if(!a) return;
  document.querySelectorAll('nav.side a').forEach(x => x.classList.remove('active'));
  a.classList.add('active');
});
renderAll();

/* ---- 密码门: 纯 JS SHA-256(紧凑实现) 只存哈希不存明文; sessionStorage 记住本会话 ---- */
var PASSWORD_HASH = "62030069b40c02d1dd642d438194850f14d9e79a25abd1e53c02f7391f8242c8";
var GATE_KEY = 'client_list_ok';
function sha256(ascii) {
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32-amount)); }
  var mathPow = Math.pow;
  var maxWord = mathPow(2, 32);
  var result = '';
  var words = [];
  var asciiBitLength = ascii.length*8;
  var hash = sha256.h = sha256.h || [];
  var k = sha256.k = sha256.k || [];
  var primeCounter = k.length;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii.length%64 - 56) ascii += '\x00';
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    if (j>>8) return '';
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words.length] = ((asciiBitLength/maxWord)|0);
  words[words.length] = (asciiBitLength);
  for (var j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
          )|0
        );
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1 + temp2)|0].concat(hash);
      hash[4] = (hash[4] + temp1)|0;
    }
    for (var i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i])|0;
  }
  for (var i = 0; i < 8; i++) {
    for (var j = 3; j + 1; j--) {
      var b = (hash[i]>>(j*8))&255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}
function unlock() {
  var gate = document.getElementById('gate');
  var input = document.getElementById('pw');
  if (sha256(input.value) === PASSWORD_HASH) {
    sessionStorage.setItem(GATE_KEY, '1');
    gate.style.display = 'none';
  } else {
    gate.classList.remove('err');
    void gate.offsetWidth;
    gate.classList.add('err');
    input.value = '';
    input.focus();
  }
}
document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
document.getElementById('btn').addEventListener('click', unlock);
if (sessionStorage.getItem(GATE_KEY) === '1') {
  document.getElementById('gate').style.display = 'none';
}
</script>
