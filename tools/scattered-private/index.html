<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>零散私密文件 · EVERSTEAD</title>
<style>
/* ============================================================
   零散私密文件 SCATTERED PRIVATE · 密码门 + 本机 IndexedDB 私密存档
   风格与私人专区/工具箱一致: 深空底 + 玻璃拟态, 零外部依赖
   文件只存本机浏览器(IndexedDB), 不上传服务器
   ============================================================ */
:root{
  --bg:#03060c;
  --panel:rgba(10,20,38,.55);
  --panel-hover:rgba(14,28,52,.75);
  --line:rgba(56,189,248,.16);
  --line-strong:rgba(56,189,248,.45);
  --cyan:#22d3ee;
  --blue:#3b82f6;
  --violet:#8b5cf6;
  --rose:#f43f5e;
  --text:#e2ecf7;
  --muted:#7d92ad;
  --glow:0 0 24px rgba(34,211,238,.25);
  --mono:'JetBrains Mono','Cascadia Mono','Consolas','Courier New',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}

.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 600px at 75% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(139,92,246,.12), transparent 60%),
    linear-gradient(rgba(56,189,248,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,.045) 1px, transparent 1px),
    var(--bg);
  background-size:auto,auto,44px 44px,44px 44px,auto;
  mask-image:radial-gradient(ellipse 120% 90% at 50% 0%, #000 55%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 120% 90% at 50% 0%, #000 55%, transparent 100%);
}

.wrap{position:relative;z-index:3;max-width:1080px;margin:0 auto;padding:0 24px 56px}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:22px 0 0;
}
.topbar .logo{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;color:#03101f;
  box-shadow:var(--glow);
  font-family:var(--mono);
}
.topbar .brand{font-family:var(--mono);font-weight:700;letter-spacing:.28em;font-size:15px}
.topbar .brand em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .back{
  margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  background:rgba(10,20,38,.4);
  transition:border-color .25s, color .25s;
}
.topbar .back:hover{border-color:var(--line-strong);color:var(--cyan)}

/* ---- 密码门 ---- */
.gate{
  max-width:420px;margin:80px auto 0;
  text-align:center;
  border:1px solid var(--line);
  border-radius:16px;
  padding:44px 32px;
  background:var(--panel);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 40px rgba(0,0,0,.35);
}
.gate .lock{font-size:44px;margin-bottom:14px}
.gate h2{font-size:20px;font-weight:700;letter-spacing:.08em;margin-bottom:8px}
.gate p{font-size:12px;color:var(--muted);margin-bottom:28px;line-height:1.8}
.gate input{
  width:100%;padding:12px 16px;
  font-family:var(--mono);font-size:16px;letter-spacing:.35em;
  color:var(--text);background:rgba(3,6,12,.6);
  border:1px solid var(--line);border-radius:10px;
  outline:none;text-align:center;
  transition:border-color .25s, box-shadow .25s;
}
.gate input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.gate button{
  margin-top:16px;width:100%;padding:12px;
  font-size:14px;font-weight:600;letter-spacing:.2em;
  color:#03101f;cursor:pointer;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  border:none;border-radius:10px;
  transition:transform .2s, box-shadow .2s;
}
.gate button:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.gate.err{animation:shake .4s}
.gate .err-msg{
  display:none;margin-top:12px;
  font-family:var(--mono);font-size:12px;color:var(--rose);
}
.gate.err .err-msg{display:block}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-8px)}
  40%,80%{transform:translateX(8px)}
}

/* ---- 主内容区(解锁后) ---- */
.content{display:none}
.content.open{display:block}
.section-head{
  display:flex;align-items:baseline;gap:12px;
  padding-bottom:12px;margin:44px 0 20px;
  border-bottom:1px solid var(--line);
}
.section-head .no{
  font-family:var(--mono);font-weight:800;font-size:13px;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.section-head h2{font-size:19px;font-weight:700;letter-spacing:.06em}

.toolbar{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
}
.toolbar .search{
  flex:1;min-width:220px;padding:10px 14px;
  font-size:14px;color:var(--text);
  background:rgba(3,6,12,.6);
  border:1px solid var(--line);border-radius:10px;outline:none;
  transition:border-color .25s;
}
.toolbar .search:focus{border-color:var(--line-strong)}
.toolbar .add-btn{
  padding:10px 20px;font-size:13px;font-weight:600;letter-spacing:.12em;
  color:#03101f;cursor:pointer;border:none;border-radius:10px;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  transition:transform .2s, box-shadow .2s;
}
.toolbar .add-btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}

.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;letter-spacing:.1em}

/* ---- 列表 ---- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}
.card{
  position:relative;
  padding:18px 18px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  backdrop-filter:blur(10px);
  transition:transform .25s, border-color .25s, background .25s;
}
.card:hover{border-color:var(--line-strong)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card-tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--violet);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;
}
.card .t{font-size:15px;font-weight:600;margin-bottom:6px}
.card .m{font-size:12px;color:var(--muted);line-height:1.6;min-height:19px}
.card .file-chip{
  display:inline-flex;align-items:center;gap:8px;margin-top:10px;max-width:100%;
  font-family:var(--mono);font-size:11px;color:var(--cyan);
  border:1px dashed var(--line-strong);border-radius:8px;padding:6px 10px;
  cursor:pointer;transition:background .25s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .file-chip:hover{background:rgba(34,211,238,.08)}
.card .meta{
  margin-top:10px;font-family:var(--mono);font-size:10px;
  color:var(--muted);letter-spacing:.08em;
  display:flex;justify-content:space-between;align-items:center;
}
.card .del{
  font-family:var(--mono);font-size:10px;color:var(--rose);cursor:pointer;
  border:1px solid rgba(244,63,94,.35);border-radius:6px;padding:3px 8px;
  background:transparent;letter-spacing:.1em;
  transition:background .25s;
}
.card .del:hover{background:rgba(244,63,94,.12)}
.empty{
  text-align:center;color:var(--muted);font-size:13px;
  padding:60px 0;border:1px dashed var(--line);border-radius:14px;
}

/* ---- 添加表单 ---- */
.form{
  display:none;
  margin-bottom:20px;
  border:1px solid var(--line);border-radius:14px;
  padding:20px;
  background:var(--panel);
  backdrop-filter:blur(10px);
}
.form.open{display:block}
.form .row{margin-bottom:12px}
.form label{
  display:block;font-size:12px;color:var(--muted);
  margin-bottom:6px;letter-spacing:.1em;
}
.form input[type=text]{
  width:100%;padding:10px 12px;font-size:14px;
  color:var(--text);background:rgba(3,6,12,.6);
  border:1px solid var(--line);border-radius:8px;outline:none;
}
.form input[type=text]:focus{border-color:var(--line-strong)}
.form input[type=file]{width:100%;font-size:12px;color:var(--muted);padding:6px 0}
.form .actions{display:flex;gap:10px;margin-top:16px}
.form button{
  padding:9px 18px;font-size:13px;border-radius:8px;cursor:pointer;letter-spacing:.1em;
}
.form .save{
  font-weight:600;color:#03101f;border:none;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
}
.form .cancel{
  color:var(--muted);background:transparent;border:1px solid var(--line);
}

.foot{
  margin-top:56px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);
  text-align:center;line-height:1.9;
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="wrap">
  <div class="topbar">
    <div class="logo">🔒</div>
    <div class="brand">SCAT<em>TERED</em> · 零散私密文件</div>
    <a class="back" href="../../private.html">← 返回私人专区</a>

  <!-- 密码门(与私人专区同锁, 本会话已解锁则直达) -->
  <div class="gate" id="gate">

      </div>

        <button class="save" id="saveBtn" type="button">保 存</button>

      </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">暂无记录 · 点「＋ 添加」存第一条</div>
  </div>

  <div class="foot">EVERSTEAD PRIVATE · 2026-09-14<br>文件仅存本机浏览器(IndexedDB), 不上传服务器 · 换浏览器/清数据会丢失, 重要文件请本地备份</div>
</div>

<script>
/* ============================================================
   纯 JS SHA-256(紧凑实现) — 源码只存哈希不存明文
   与私人专区同哈希同锁, sessionStorage 同一 key 互通
   ============================================================ */
var PASSWORD_HASH = "a68afcaa33dc88de7217371b041b422543aa16e2958365dde8112487475e37cd";

function sha256(ascii) {
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32-amount)); }
  var mathPow = Math.pow;
  var maxWord = mathPow(2, 32);
  var result = '';
  var words = [];
  var asciiBitLength = ascii.length*8;
  var hash = sha256.h = sha256.h || [];
  var k = sha256.k = sha256.k || [];
  var primeCounter = k.length;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii.length%64 - 56) ascii += '\x00';
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    if (j>>8) return '';
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words.length] = ((asciiBitLength/maxWord)|0);
  words[words.length] = (asciiBitLength);
  for (var j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
          )|0
        );
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1 + temp2)|0].concat(hash);
      hash[4] = (hash[4] + temp1)|0;
    }
    for (var i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i])|0;
  }
  for (var i = 0; i < 8; i++) {
    for (var j = 3; j + 1; j--) {
      var b = (hash[i]>>(j*8))&255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

function unlock() {
  var gate = document.getElementById('gate');
  var input = document.getElementById('pw');
  if (sha256(input.value) === PASSWORD_HASH) {
    sessionStorage.setItem('private_ok', '1');
    gate.style.display = 'none';
    document.getElementById('content').classList.add('open');
  } else {
    gate.classList.remove('err');
    void gate.offsetWidth;  /* 重触发抖动动画 */
    gate.classList.add('err');
    input.value = '';
    input.focus();
  }
}

/* 本会话已解锁过(私人专区同 key) → 直接显示 */
if (sessionStorage.getItem('private_ok') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('content').classList.add('open');
}

document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
document.getElementById('btn').addEventListener('click', unlock);

/* ============================================================
   IndexedDB 本机存储(不上传服务器)
   ============================================================ */
var DB_NAME = 'scattered_private_db';
var STORE = 'files';
var db = null;

/* 初始种子条目(老板 2026-09-14 口述) */
var SEED = [
  {name: '李乔', category: '人名档案', note: ''},
  {name: '亓官雨荷', category: '人名档案', note: '媳妇名字'},
  {name: '李思亓', category: '人名档案', note: '小孩名字'},
  {name: '陈宇', category: '人名档案', note: '齐总爱人, 事业单位行政'}
];

function openDB(cb) {
  var req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = function(e) {
    var d = e.target.result;
    if (!d.objectStoreNames.contains(STORE)) {
      d.createObjectStore(STORE, {keyPath: 'id', autoIncrement: true});
    }
  };
  req.onsuccess = function(e) {
    db = e.target.result;
    seedIfEmpty(function() { render(); });
    if (cb) cb();
  };
  req.onerror = function(e) {
    console.error('[scattered-private] IndexedDB 打开失败', e);
  };
}

function seedIfEmpty(cb) {
  if (localStorage.getItem('scattered_seeded') === '1') { cb(); return; }
  var tx = db.transaction(STORE, 'readwrite');
  var store = tx.objectStore(STORE);
  var countReq = store.count();
  countReq.onsuccess = function() {
    if (countReq.result > 0) { localStorage.setItem('scattered_seeded', '1'); cb(); return; }
    SEED.forEach(function(s) {
      store.add({name: s.name, category: s.category, note: s.note, addedAt: Date.now()});
    });
    localStorage.setItem('scattered_seeded', '1');
    cb();
  };
}

function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }

function render() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var tx = db.transaction(STORE, 'readonly');
  var req = tx.objectStore(STORE).getAll();
  req.onsuccess = function() {
    var items = req.result || [];
    items.sort(function(a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
    var matched = items.filter(function(it) {
      if (!q) return true;
      return (it.name || '').toLowerCase().indexOf(q) >= 0
          || (it.category || '').toLowerCase().indexOf(q) >= 0
          || (it.note || '').toLowerCase().indexOf(q) >= 0;
    });
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.getElementById('count').textContent =
      '共 ' + matched.length + ' 条' + (q ? '(匹配)' : '');
    document.getElementById('empty').style.display = matched.length ? 'none' : 'block';
    matched.forEach(function(it) {
      var card = document.createElement('div');
      card.className = 'card';

      var top = document.createElement('div');
      top.className = 'card-top';
      var tag = document.createElement('span');
      tag.className = 'card-tag';
      tag.textContent = it.category || '未分类';
      top.appendChild(tag);
      card.appendChild(top);

      var t = document.createElement('div');
      t.className = 't';
      t.textContent = it.name || '(未命名)';
      card.appendChild(t);

      var m = document.createElement('div');
      m.className = 'm';
      m.textContent = it.note || '';
      card.appendChild(m);

      if (it.blob) {
        var chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.title = '点击下载';
        chip.textContent = '📎 ' + (it.fileName || '文件') + ' · ' + fmtSize(it.fileSize);
        chip.addEventListener('click', function() {
          var url = URL.createObjectURL(it.blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = it.fileName || 'file';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        });
        card.appendChild(chip);
      }

      var meta = document.createElement('div');
      meta.className = 'meta';
      var when = document.createElement('span');
      when.textContent = new Date(it.addedAt || 0).toLocaleDateString('zh-CN');
      meta.appendChild(when);
      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '删除';
      del.addEventListener('click', function() {
        if (!confirm('删除「' + (it.name || '') + '」? 本机存档, 删后不可恢复。')) return;
        var dtx = db.transaction(STORE, 'readwrite');
        dtx.objectStore(STORE).delete(it.id);
        dtx.oncomplete = function() { render(); };
      });
      meta.appendChild(del);
      card.appendChild(meta);

      grid.appendChild(card);
    });
  };
}

/* ---- 添加表单 ---- */
var form = document.getElementById('form');
document.getElementById('addBtn').addEventListener('click', function() {
  form.classList.add('open');
  document.getElementById('f_name').focus();
});
document.getElementById('cancelBtn').addEventListener('click', function() {
  form.classList.remove('open');
});
document.getElementById('saveBtn').addEventListener('click', function() {
  var name = document.getElementById('f_name').value.trim();
  if (!name) { alert('名称必填'); return; }
  var entry = {
    name: name,
    category: document.getElementById('f_cat').value.trim() || '未分类',
    note: document.getElementById('f_note').value.trim(),
    addedAt: Date.now()
  };
  var file = document.getElementById('f_file').files[0];
  function save() {
    var tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).add(entry);
    tx.oncomplete = function() {
      form.classList.remove('open');
      document.getElementById('f_name').value = '';
      document.getElementById('f_cat').value = '';
      document.getElementById('f_note').value = '';
      document.getElementById('f_file').value = '';
      render();
    };
  }
  if (file) {
    entry.fileName = file.name;
    entry.fileSize = file.size;
    entry.fileType = file.type;
    var reader = new FileReader();
    reader.onload = function() { entry.blob = reader.result; save(); };
    reader.readAsArrayBuffer(file);
  } else {
    save();
  }
});

document.getElementById('q').addEventListener('input', render);

openDB();
console.log('[scattered-private] 已初始化');
</script>
</body>
</html>
