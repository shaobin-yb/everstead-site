const main = document.getElementById('main');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderProvince(p, keyword, typeF){
  const cityGroups = new Map();
  p.clients.forEach(c => {
    const k = c.city || '未标注城市';
    if(!cityGroups.has(k)) cityGroups.set(k, []);
    cityGroups.get(k).push(c);
  });
  const sec = document.createElement('section');
  sec.className = 'prov'; sec.id = p.name;
  sec.innerHTML = `<div class="prov-head"><h2>${esc(p.name)}</h2><span class="n">${p.count} 家</span></div>`;
  const sortedCities = [...cityGroups.keys()].sort();
  sortedCities.forEach(city => {
    const list = cityGroups.get(city);
    const div = document.createElement('div');
    div.className = 'city-block';
    div.innerHTML = `<div class="city-head">${esc(city)} · ${list.length}</div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = c.name; card.dataset.biz = c.biz; card.dataset.city = c.city || '';
      card.innerHTML = `
        <div class="nm">${esc(c.name)}</div>
        <div class="meta">
          <span class="tag ${typeColor(c.biz)}">${esc(c.biz)}</span>
          ${c.city ? `<span class="city">📍${esc(c.city)}</span>` : ''}
        </div>`;
      grid.appendChild(card);
    });
    div.appendChild(grid);
    sec.appendChild(div);
  });
  main.appendChild(sec);
}
function renderAll(){
  main.innerHTML = '';
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  DATA.provinces.forEach(p => {
    const visible = p.clients.filter(c => {
      const okK = !kw || c.name.toLowerCase().includes(kw) || (c.city||'').toLowerCase().includes(kw) || c.biz.toLowerCase().includes(kw);
      const okC = !activeCat || (c.category || '其他') === activeCat;
      return okK && okC;
    });
    if(!visible.length) return;
    const provCopy = {...p, clients: visible, count: visible.length};
    renderProvince(provCopy, kw, activeCat);
    shown += visible.length;
  });
  document.getElementById('emptyTip').style.display = shown ? 'none' : 'block';
  // 导航高亮按需
  document.querySelectorAll('nav.side a').forEach(a => {
    const pid = a.getAttribute('href').slice(1);
    a.style.display = document.getElementById(pid) ? '' : 'none';
  });
}
document.getElementById('search').addEventListener('input', renderAll);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  activeCat = '';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.textContent.startsWith('全部')));

});

  const a = e.target.closest('a'); if(!a) return;
  document.querySelectorAll('nav.side a').forEach(x => x.classList.remove('active'));
  a.classList.add('active');
});
renderAll();

    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii.length%64 - 56) ascii += '\x00';
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    if (j>>8) return '';
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words.length] = ((asciiBitLength/maxWord)|0);
  words[words.length] = (asciiBitLength);
  for (var j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
          )|0
        );
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1 + temp2)|0].concat(hash);
      hash[4] = (hash[4] + temp1)|0;
    }
    for (var i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i])|0;
  }
  for (var i = 0; i < 8; i++) {
    for (var j = 3; j + 1; j--) {
      var b = (hash[i]>>(j*8))&255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}
function unlock() {
  var gate = document.getElementById('gate');
  var input = document.getElementById('pw');
  if (sha256(input.value) === PASSWORD_HASH) {
    sessionStorage.setItem(GATE_KEY, '1');
    gate.style.display = 'none';
  } else {
    gate.classList.remove('err');
    void gate.offsetWidth;
    gate.classList.add('err');
    input.value = '';
    input.focus();
  }
}
document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
document.getElementById('btn').addEventListener('click', unlock);
if (sessionStorage.getItem(GATE_KEY) === '1') {
  document.getElementById('gate').style.display = 'none';
}
</script>
