const START = new Date(2026, 9, 21);

function ymd(d){
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const all = [];
PLAN.weeks.forEach(w => w.days.forEach(d => all.push({...d, week: w.week, theme: w.theme})));

const now = new Date();
now.setHours(0,0,0,0);
const n = Math.round((now - START) / 86400000);

const card = document.getElementById('card');
let day = null, stageLabel = '', totalDays = 42;

if (n < 0) {
  card.innerHTML = '<div class="empty"><h2>还没开始</h2><p>月子餐从 ' + ymd(START) + ' 开始。</p></div>';
} else if (n < 28) {
  day = all[n];
  stageLabel = '第 ' + day.week + ' 周 · ' + day.theme;
} else if (n < totalDays) {
  const idx = 21 + ((n - 21) % 7);
  day = all[idx];
  stageLabel = '第 ' + (n < 35 ? 5 : 6) + ' 周 · 按第 4 周轮换';
}

if (n >= 0 && !day) {
  card.innerHTML = '<div class="empty"><h2>出月子啦</h2><p>42 天走完了，接下来好好吃饭、慢慢恢复。<br>这份餐单随时可以翻回去看。</p></div>';
}

if (day) {
  const rows = day.meals.map((m, i) =>
    '<div class="row" style="animation-delay:' + (0.06 * i) + 's">' +
      '<div class="t">' + esc(m.time.replace(/^\S+\s+/, '')) + '</div>' +
      '<div><div class="d">' + esc(m.dishes) + '</div>' +
      (m.note ? '<div class="n">' + esc(m.note) + '</div>' : '') +
      '</div></div>'
  ).join('');

  const quote = QUOTES[(n < 28 ? n : 21 + ((n - 21) % 7))] || '';
  const left = Math.max(0, totalDays - n);

  card.innerHTML =
    '<div class="top"></div>' +
    '<div class="head">' +
      '<div class="date">' + ymd(now) + '</div>' +
      '<div class="dayno">产后第 ' + (n + 1) + ' 天</div>' +
      '<div class="stage">' + esc(stageLabel) + '</div>' +
      '<div class="tag">' + esc(day.tag) + '</div>' +
    '</div>' +
    '<div class="meals">' + rows + '</div>' +
    '<div class="quote"><p>' + esc(quote) + '</p></div>' +
