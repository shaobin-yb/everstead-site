const tb = document.getElementById('tb');
const cnt = document.getElementById('cnt');
let sortAmt = 0; // 0=原始序, 1=规模降, -1=规模升

function val(d) { return (d.name + ' ' + d.mgr + ' ' + d.t + ' ' + d.type + ' ' + d.pj).toLowerCase(); }

function render() {
  const fy = document.getElementById('fYear').value;
  const fp = document.getElementById('fPj').value;
  const fm = document.getElementById('fMgr').value.trim().toLowerCase();
  const fk = document.getElementById('fKw').value.trim().toLowerCase();
  let list = DATA.filter(d => {
    if (fy && d.y !== fy) return false;
    if (fp && d.pj !== fp) return false;
    if (fm && !d.mgr.toLowerCase().includes(fm)) return false;
    if (fk && !val(d).includes(fk)) return false;
    return true;
  });
  if (sortAmt !== 0) {
    list = list.slice().sort((a, b) => {
      const av = parseFloat(a.amt) || 0, bv = parseFloat(b.amt) || 0;
      return sortAmt === 1 ? bv - av : av - bv;
    });
  }
  cnt.textContent = '当前显示 ' + list.length + ' / ' + DATA.length + ' 条';
  tb.innerHTML = list.slice(0, 1000).map(d =>
    '<tr><td>' + d.y + '</td><td>' + d.seq + '</td><td class="name">' + d.name + '</td>' +
    '<td>' + d.mgr + '</td><td>' + d.t + '</td><td>' + d.type + '</td>' +
    '<td class="amt">' + d.amt + '</td><td>' + d.term + '</td><td>' + d.pj + '</td></tr>'
  ).join('');
}

function sortByAmt() { sortAmt = sortAmt === 1 ? -1 : 1; render(); }
function resetFilters() {
  document.getElementById('fYear').value = '';
  document.getElementById('fPj').value = '';
  document.getElementById('fMgr').value = '';
  document.getElementById('fKw').value = '';
  sortAmt = 0; render();
}
['fYear','fPj','fMgr','fKw'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
